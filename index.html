">Art. 11.6<\/span><h3>Règlement du Pays Neutre<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#paysNeutre<\/span><span>#diplomatie<\/span><span>#ticket<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le Pays Neutre est un territoire placé sous la protection indirecte des Grandes Nations. Les familles et clans qui y résident doivent respecter un cadre particulier afin de préserver l'équilibre politique et militaire du monde.<\/p>\n\n          <div class=\"sub-article\">\n            <h4>Art. 11.6.1 — Statut des familles du Pays Neutre<\/h4>\n            <p>Les familles résidant dans le Pays Neutre sont considérées, à leur arrivée, comme des villageois.<\/p>\n            <p>Elles ne sont affiliées à aucune Grande Nation et bénéficient donc d'une protection diplomatique de la part de celles-ci.<\/p>\n            <p>Cette protection implique qu'aucune Grande Nation ne peut s'en prendre librement à une famille résidant dans le Pays Neutre, que ce soit par des attaques, des enlèvements, des pressions militaires ou toute autre action susceptible de lui causer un préjudice important.<\/p>\n          <\/div>\n\n          <div class=\"sub-article\">\n            <h4>Art. 11.6.2 — Atteinte à une famille du Pays Neutre<\/h4>\n            <p>Si une Grande Nation attaque, menace ou cause volontairement un préjudice injustifié à une famille du Pays Neutre, un Conseil des Kage pourra être convoqué.<\/p>\n            <p>Ce conseil aura pour objectif d'étudier les faits, d'entendre les différentes parties et de déterminer les responsabilités.<\/p>\n            <p>Si une Grande Nation est reconnue fautive, des sanctions diplomatiques ou RP pourront être appliquées à celle-ci en fonction de la gravité des faits.<\/p>\n            <p>Le Pays Neutre ne constitue donc pas une zone où les conflits sont impossibles, mais une zone bénéficiant d'un cadre diplomatique renforcé.<\/p>\n          <\/div>\n\n          <div class=\"sub-article\">\n            <h4>Art. 11.6.3 — Actions contre une Grande Nation<\/h4>\n            <p>Une famille résidant dans le Pays Neutre ne peut pas décider seule de déclencher une action majeure contre une Grande Nation.<\/p>\n            <p>Toute action pouvant provoquer un conflit important, une guerre, une attaque organisée, un assassinat politique ou une grave crise diplomatique devra obligatoirement faire l'objet d'un ticket d'approbation auprès du Staff.<\/p>\n            <p>La demande devra présenter :<\/p>\n            <ul>\n              <li>Les raisons RP justifiant l'action ;<\/li>\n              <li>Le contexte et les événements ayant conduit à cette décision ;<\/li>\n              <li>Les objectifs recherchés ;<\/li>\n              <li>Les joueurs/familles concernés ;<\/li>\n              <li>Les conséquences RP envisagées.<\/li>\n            <\/ul>\n            <p>Une action ne pourra être lancée qu'après validation du Staff.<\/p>\n          <\/div>\n\n          <div class=\"sub-article\">\n            <h4>Art. 11.6.4 — Principe fondamental<\/h4>\n            <p>Les habitants du Pays Neutre disposent d'une certaine liberté RP, mais cette liberté ne doit pas être utilisée pour provoquer artificiellement les Grandes Nations ou contourner les règles de guerre et de conflit.<\/p>\n            <p>Toute action doit être cohérente avec le RP, justifiée par le lore et proportionnée au contexte.<\/p>\n            <p>Le Staff se réserve le droit d'intervenir lorsqu'une action est considérée comme abusive, incohérente ou susceptible de déséquilibrer le RP global.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- HRP -->\n    <div class=\"section-banner\">\n      <span class=\"tag\">HRP<\/span>\n      <h1>Règlement HRP.<\/h1>\n      <p>Le cadre hors-RP : procédures, staff, identité et confidentialité.<\/p>\n    <\/div>\n\n    <section id=\"hrp-1\">\n      <h2>01. Principes de base <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Cette partie fixe les bases du comportement attendu hors-RP.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.1<\/span><h3>Respect et attitude générale<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#respect<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tu dois respecter le staff et les autres joueurs.<\/p>\n          <p>Cette exigence vaut :<\/p>\n          <ul><li>À l'écrit.<\/li><li>En vocal.<\/li><li>En ticket.<\/li><li>En jeu.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.2<\/span><h3>Séparation RP / HRP<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#meta<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tu dois toujours séparer le RP du HRP.<\/p>\n          <p>Une information HRP ne devient jamais automatiquement une information RP.<\/p>\n          <p>Le HRP ne doit jamais servir à influencer, contourner ou casser une scène.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.3<\/span><h3>Cohérence générale<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#cohérence<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tu dois rester cohérent avec ton personnage dans toutes tes scènes.<\/p>\n          <p>Une incohérence volontaire jouée pour obtenir un avantage peut être sanctionnée.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.4<\/span><h3>Sanctions lourdes et abus HRP<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#ban<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Discrimination, harcèlement, publicité externe et échange contre de l'argent réel entraînent des sanctions lourdes, jusqu'au bannissement.<\/p>\n          <p>Aucune justification RP ne couvre un abus HRP.<\/p>\n          <p>Powergaming, meta volontaire, no fear abusif ou pression HRP peuvent être sanctionnés immédiatement.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-2\">\n      <h2>02. Tickets &amp; procédures <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Toute demande officielle doit passer par la bonne procédure, avec preuves et contexte.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.1<\/span><h3>Création de ticket<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#ticket<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Passe par ticket pour :<\/p>\n          <ul><li>Contestations.<\/li><li>Déwarn.<\/li><li>Déban.<\/li><li>Changement de village.<\/li><li>Plaintes.<\/li><li>Demandes admin.<\/li><\/ul>\n          <p>Utilise la bonne catégorie : problème, plainte, partenariat, candidature staff, autres.<\/p>\n          <p>Chaque demande doit être : claire, détaillée, respectueuse.<\/p>\n          <p>Pour toute plainte, des preuves sont obligatoires :<\/p>\n          <ul><li>Captures d'écran.<\/li><li>Vidéos.<\/li><li>Éléments datés.<\/li><\/ul>\n          <p>Il est interdit :<\/p>\n          <ul><li>D'ouvrir un ticket inutile.<\/li><li>De troll en ticket.<\/li><li>De spam.<\/li><li>De faire perdre du temps au staff.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.2<\/span><h3>Contestations<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#ticket<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Toute contestation d'une décision staff passe par :<\/p>\n          <ul><li>Un ticket.<\/li><li>Le support vocal si demandé.<\/li><\/ul>\n          <p>Contacter un staff en message privé pour contester est interdit.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.3<\/span><h3>Déwarn et déban<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#sanction<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Toute demande de déwarn ou de déban passe obligatoirement par ticket.<\/p>\n          <p>La sanction doit dater d'au moins un à deux mois selon sa gravité.<\/p>\n          <p>Une demande trop récente ne sera pas examinée. Toute requête transmise en message privé est interdite.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.4<\/span><h3>Ticket admin et scènes sensibles<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#staff<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Quand un ticket admin est validé, la scène doit être faite dans le délai donné. Si la scène n'est pas jouée à temps, le ticket peut être fermé.<\/p>\n          <p>Indique toujours : ton nom RP, le contexte précis, la demande exacte.<\/p>\n          <p>Scènes demandant validation préalable :<\/p>\n          <ul><li>Scène RPK.<\/li><li>Capture très sensible.<\/li><li>Attaque de village.<\/li><li>Scène exceptionnelle demandant un arbitrage staff.<\/li><\/ul>\n          <p>Les Keto, RPK et autres scènes à trame doivent obligatoirement être joués sous surveillance staff.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.5<\/span><h3>Changement de village<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#village<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tout changement de village passe par la procédure officielle via ticket.<\/p>\n          <p>Le non-respect de cette démarche peut entraîner des sanctions.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-3\">\n      <h2>03. Cohérence RP &amp; scènes <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Tu joues d'abord. Tu contestes après.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.1<\/span><h3>Cohérence RP en scène<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#cohérence<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tout au long de ton aventure, tu dois respecter la cohérence de ton personnage.<\/p>\n          <p>Exemple : modifier instantanément son apparence pour contourner une reconnaissance n'est pas accepté.<\/p>\n          <p>Une scène incohérente peut être annulée ou sanctionnée.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.2<\/span><h3>Déconnexion en scène<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#scène<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit de se déconnecter en pleine scène. En cas de nécessité, préviens les personnes concernées à l'avance.<\/p>\n          <p>Quitter une scène sans prévenir peut être traité comme un contournement des règles.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.3<\/span><h3>Langage HRP et insinuation HRP<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#meta<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Pendant une scène RP, reste dans ton personnage. Si tu penses qu'une règle est enfreinte, termine la scène d'abord.<\/p>\n          <p>Il est strictement interdit de revenir sur une scène en cours pour la contester, la réécrire ou en casser le déroulé.<\/p>\n          <p>Tu joues la scène jusqu'au bout, puis tu fais ton retour avec preuves via la bonne procédure.<\/p>\n          <p>Zones concernées par l'interdiction de spam HRP, meta ou pollution du chat :<\/p>\n          <ul><li>Scènes de capture.<\/li><li>Interrogatoires.<\/li><li>Bastions.<\/li><li>Combats encadrés.<\/li><li>Événements sensibles.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.4<\/span><h3>Taunt<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#taunt<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le taunt doit rester RP. Il ne doit jamais servir à harceler ou insulter HRP.<\/p>\n          <p>Le taunt doit :<\/p>\n          <ul><li>Respecter le niveau du combat.<\/li><li>Rester logique.<\/li><li>Refléter le personnage.<\/li><li>Rester crédible dans le contexte.<\/li><\/ul>\n          <p>Exemple interdit : /me regarde le chien de Konoha en face de lui.<\/p>\n          <p>Exemple correct : /me regarde le ninja de Konoha en face de lui.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-4\">\n      <h2>04. Vocal &amp; communications <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Tout canal vocal externe peut devenir du métagaming s'il influence une scène RP.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.1<\/span><h3>Communication vocale<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#vocal<\/span><\/div>\n        <div class=\"article-body\">\n          <p>L'usage du vocal en jeu doit rester correct. Évite les bruits parasites.<\/p>\n          <p>Les soundboards à but de provocation ou de troll sont interdits.<\/p>\n          <p>Les modificateurs de voix excessifs ne sont pas autorisés.<\/p>\n          <p>Le vocal externe ne doit jamais servir à contourner les règles RP. Transmettre une information RP par double vocal, vocal externe ou relais HRP constitue du métagaming.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.2<\/span><h3>Double vocal<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#meta<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit de participer à une discussion active sur Discord ou ailleurs pendant une scène RP.<\/p>\n          <p>Il est aussi interdit de transmettre des informations RP par vocal externe.<\/p>\n          <p>Si un Discord RP lié au serveur existe, les très hauts staffs concernés doivent pouvoir y accéder. À défaut, les informations qui y circulent peuvent être considérées comme non-RP.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.3<\/span><h3>!pm<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#commande<\/span><\/div>\n        <div class=\"article-body\">\n          <p>La commande !pm est HRP. Elle ne doit jamais servir à transmettre une information RP.<\/p>\n          <p>Exemple interdit : !pm je me suis fait capturer.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-5\">\n      <h2>05. Identité RP &amp; comptes <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Ton identité et ton compte engagent ta responsabilité.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 5.1<\/span><h3>Nom RP<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#identité<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Ton nom doit être cohérent avec l'univers Naruto.<\/p>\n          <p>Il est interdit d'utiliser :<\/p>\n          <ul><li>Un prénom repris directement de l'œuvre.<\/li><li>Un nom de famille de personnage repris directement de l'œuvre (hors noms de clan officiels du serveur).<\/li><li>Une référence obscène.<\/li><li>Une référence raciste.<\/li><li>Une référence déplacée.<\/li><\/ul>\n          <p>Exemples interdits : Naruto, Sasuke, Shisui.<\/p>\n          <p>Les noms de clan (Uchiha, Hyuga, Senju, etc.) restent autorisés comme nom de famille si ton personnage appartient réellement à ce clan.<\/p>\n          <p>Tu dois avoir un prénom et un nom. La seule exception possible est un projet RP orphelin validé.<\/p>\n          <p>Les noms repris ou inspirés d'autres œuvres peuvent être remplacés.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 5.2<\/span><h3>Partage de compte<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#compte<\/span><\/div>\n        <div class=\"article-body\"><p>Le partage de compte est strictement interdit. Personne d'autre ne doit jouer ton personnage.<\/p><\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 5.3<\/span><h3>Multi-comptes<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#compte<\/span><span>#ban<\/span><\/div>\n        <div class=\"article-body\">\n          <p>La création ou l'utilisation de plusieurs comptes est interdite pour :<\/p>\n          <ul><li>Contourner une sanction.<\/li><li>Obtenir des avantages supplémentaires.<\/li><li>Espionner un autre village ou groupe.<\/li><\/ul>\n          <p>Toute tentative de contournement de sanction via multi-comptes entraîne un bannissement définitif.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-6\">\n      <h2>06. Comportement HRP <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Insultes, harcèlement et pressions HRP n'ont aucune tolérance.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.1<\/span><h3>Respect et maturité<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#respect<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les insultes sont interdites. Tout comportement HRP envers le staff, les streamers ou les autres membres doit rester respectueux.<\/p>\n          <p>Jouer sur les émotions du staff, ses relations ou envoyer des proches pour influencer une décision peut mener à un bannissement définitif.<\/p>\n          <p>Si tu es témoin ou victime d'un comportement inapproprié, signale-le au staff. Pour un problème impliquant un streamer, passe par ticket avec des preuves.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.2<\/span><h3>Discrimination et harcèlement<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#ban<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Toute forme de discrimination ou de harcèlement est strictement interdite, en RP comme en HRP.<\/p>\n          <p>Ce type de comportement entraîne un bannissement définitif.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.3<\/span><h3>Publicité<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#ban<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Toute publicité sur le serveur est interdite. La sanction peut aller jusqu'au bannissement permanent.<\/p>\n          <p>Les seules exceptions relèvent du fondateur ou du système officiel de partenariat.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.4<\/span><h3>Stream et contenu public<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#stream<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Quand un joueur stream ou enregistre sur le serveur, il reste responsable de son comportement. Les règles du serveur s'appliquent toujours.<\/p>\n          <p>Il est interdit :<\/p>\n          <ul><li>D'inciter un chat à perturber le RP.<\/li><li>De provoquer des joueurs pour faire du contenu.<\/li><li>De révéler des informations sensibles du serveur.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.5<\/span><h3>Groupes HRP nuisibles<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#abus<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit d'organiser en HRP des actions visant à perturber le serveur ou une faction.<\/p>\n          <p>Exemples :<\/p>\n          <ul><li>Raid HRP.<\/li><li>Organisation de grief.<\/li><li>Coordination pour nuire à un joueur ou à un groupe.<\/li><\/ul>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-7\">\n      <h2>07. Échanges &amp; transferts <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Toute monétisation externe ou transfert d'éléments sensibles est interdit.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.1<\/span><h3>Échange et transaction<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#ban<\/span><span>#argent<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tout échange impliquant une monnaie externe au serveur est interdit.<\/p>\n          <p>La sanction est le bannissement définitif.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.2<\/span><h3>Transferts interdits<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#transfert<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le transfert d'un Kekkei Genkai Légendaire d'un personnage à un autre n'est pas autorisé.<\/p>\n          <p>Les Kekkei Genkai en dessous du rang Légendaire peuvent être transférés, dans le respect des procédures de vol/transfert prévues par le règlement (ticket, suivi RP).<\/p>\n          <p>Les autres objets ne sont pas transférables non plus :<\/p>\n          <ul><li>Tenues.<\/li><li>Objets boutique.<\/li><li>Avantages liés au personnage.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.3<\/span><h3>Artefacts et éléments sensibles<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#artefact<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les artefacts uniques, objets rares ou éléments sensibles ne peuvent faire l'objet :<\/p>\n          <ul><li>D'aucune duplication.<\/li><li>D'aucun échange HRP.<\/li><li>D'aucun arrangement hors cadre serveur.<\/li><\/ul>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-8\">\n      <h2>08. Bugs &amp; contournements <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Les bugs, contournements de sanctions et abus de systèmes exposent à des sanctions lourdes.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.1<\/span><h3>Exploitation de bugs<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#bug<\/span><\/div>\n        <div class=\"article-body\">\n          <p>L'utilisation de bugs, glitches ou failles techniques du serveur est strictement interdite.<\/p>\n          <p>Exemples :<\/p>\n          <ul><li>Utiliser un bug de map.<\/li><li>Exploiter un bug de combat.<\/li><li>Traverser des objets ou des zones via un bug.<\/li><li>Exploiter une mécanique cassée du serveur.<\/li><\/ul>\n          <p>Tout bug découvert doit être signalé au staff immédiatement.<\/p>\n          <p>Le staff peut aussi :<\/p>\n          <ul><li>Annuler les gains obtenus.<\/li><li>Rollback une action ou une scène.<\/li><li>Alourdir la sanction en cas de récidive.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.2<\/span><h3>Contournement de sanctions<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#ban<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit de contourner une sanction de quelque manière que ce soit.<\/p>\n          <p>Exemples :<\/p>\n          <ul><li>Utiliser un autre compte.<\/li><li>Demander à un autre joueur d'agir à sa place.<\/li><li>Utiliser un compte secondaire.<\/li><\/ul>\n          <p>Toute tentative de contournement peut entraîner un bannissement permanent.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.3<\/span><h3>Abus de systèmes serveur<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#abus<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tout abus volontaire des systèmes du serveur est interdit.<\/p>\n          <p>Exemples :<\/p>\n          <ul><li>Détourner une mécanique pour obtenir un avantage.<\/li><li>Exploiter une faille de progression.<\/li><li>Manipuler un système prévu pour un autre usage.<\/li><\/ul>\n          <p>Le staff se réserve le droit d'annuler les gains obtenus de manière abusive.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.4<\/span><h3>Responsabilité du joueur<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#responsabilité<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Chaque joueur est responsable :<\/p>\n          <ul><li>De son compte.<\/li><li>De ses actions.<\/li><li>De son comportement.<\/li><\/ul>\n          <p>Toute action réalisée depuis un compte est considérée comme venant de son propriétaire.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.5<\/span><h3>Anti-AFK et AFK farm<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#AFK<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit de contourner l'anti-AFK du serveur.<\/p>\n          <p>Exemples interdits :<\/p>\n          <ul><li>Macro.<\/li><li>Script.<\/li><li>Mouvement automatique.<\/li><li>Retour périodique uniquement pour éviter la déconnexion.<\/li><\/ul>\n          <p>L'anti-AFK existe pour limiter le farm passif et libérer des slots. Tout contournement peut entraîner une sanction.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-9\">\n      <h2>09. Staff &amp; confidentialité <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Contacte le staff pour un besoin réel, pas pour gagner du confort ou du temps.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.1<\/span><h3>Contact staff<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#staff<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit de mentionner un staff sur Discord ou de lui envoyer un DM sans raison valable.<\/p>\n          <p>L'usage de !pm pour contacter un staff doit rester exceptionnel.<\/p>\n          <p>Exemples valables :<\/p>\n          <ul><li>Problème sérieux en RP.<\/li><li>Bug majeur.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.2<\/span><h3>Confidentialité des tickets &amp; décisions<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#confidentialité<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le contenu des tickets et des décisions du staff est confidentiel.<\/p>\n          <p>Il est interdit de :<\/p>\n          <ul><li>Partager des captures de ticket.<\/li><li>Diffuser une discussion staff.<\/li><li>Publier une décision staff hors contexte.<\/li><\/ul>\n          <p>Toute fuite volontaire peut entraîner des sanctions.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.3<\/span><h3>Décisions staff<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#staff<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les décisions du staff doivent être respectées.<\/p>\n          <p>Même en cas de désaccord :<\/p>\n          <ul><li>La décision doit être appliquée.<\/li><li>La contestation doit suivre la procédure officielle.<\/li><\/ul>\n          <p>Refuser d'appliquer une décision staff peut entraîner des sanctions supplémentaires.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.5<\/span><h3>Zone RPK<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#RPK<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit d'annoncer une zone RPK via /na sans ticket ou validation staff préalable.<\/p>\n          <p>Aucune zone RPK ne peut être déclarée dans un village sans accord explicite du staff.<\/p>\n\n          <p><strong>Exception :<\/strong><\/p>\n          <p>Les clans et les zones détenues par un clan (habitations Uchiha, etc.) sont soumis au Mass RP et considérés comme zone de RPK par le clan qui la détient, sans nécessiter de validation staff préalable.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.6<\/span><h3>Slots Jonin et CMJ<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#grade<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Chaque village dispose actuellement de :<\/p>\n          <ul><li>5 slots Jonin.<\/li><li>2 slots Commandants Militaires Jonin (CMJ).<\/li><li>6 slots Force Spéciale.<\/li><\/ul>\n          <p>Parmi les 5 Jonin, 2 à 3 doivent obligatoirement être sans clan. Les membres de clans mineurs sont comptés comme sans clan pour cette répartition.<\/p>\n          <p>Être Jonin ne garantit aucune place automatique en guerre. Le rôle se joue aussi hors combat :<\/p>\n          <ul><li>Interactions.<\/li><li>Missions.<\/li><li>Présence RP.<\/li><li>Responsabilités quotidiennes.<\/li><\/ul>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"hrp-10\">\n      <h2>10. Suivi RP &amp; événements <span class=\"badge\">HRP<\/span><\/h2>\n      <p class=\"theme-intro\">Apprentissage, preuves, validations et cadre des animations.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 10.1<\/span><h3>Suivi RP et apprentissage<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#progression<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Jouer une technique sans suivi RP peut annuler la scène et retirer l'avantage joué.<\/p>\n          <p>L'apprentissage de toute technique, jutsu, capacité ou compétence doit faire l'objet d'un suivi RP sérieux.<\/p>\n          <p>Tu dois apprendre auprès d'une source RP légitime :<\/p>\n          <ul><li>Sensei.<\/li><li>Entraînement.<\/li><li>Rouleau.<\/li><li>Clan.<\/li><li>Maître.<\/li><\/ul>\n          <p>Aucun apprentissage instantané n'est accepté. Chaque progression doit être :<\/p>\n          <ul><li>Progressive.<\/li><li>Logique.<\/li><li>Adaptée à la puissance.<\/li><li>Adaptée à la complexité.<\/li><\/ul>\n          <p>Il est interdit :<\/p>\n          <ul>\n            <li>D'utiliser une technique jamais apprise en RP.<\/li>\n            <li>D'utiliser une technique sans entraînement RP.<\/li>\n            <li>De prétendre connaître une technique sans justification RP.<\/li>\n            <li>D'apprendre seul une technique nécessitant un maître, un clan ou une condition spéciale.<\/li>\n          <\/ul>\n          <p>Le suivi RP doit pouvoir être prouvé à tout moment : captures, vidéos, fiche technique, validation staff.<\/p>\n          <p>Pour les techniques rares, très puissantes ou particulièrement sensibles, une validation staff peut être exigée avant usage.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 10.2<\/span><h3>Événements spéciaux<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#event<\/span><\/div>\n        <div class=\"article-body\">\n          <p>La participation aux événements spéciaux, tournois et animations reste facultative. Aucun refus n'impacte la progression RP normale.<\/p>\n          <p>Pendant ces événements, les règles serveur s'appliquent toujours :<\/p>\n          <ul><li>Fairplay.<\/li><li>Limites de techniques.<\/li><li>Repli.<\/li><li>Capture.<\/li><li>Artefacts.<\/li><li>RPK.<\/li><li>Tenues.<\/li><\/ul>\n          <p>Il est interdit de voler tenues, armes uniques, pupilles ou objets liés à un joueur, sauf indication contraire du scénario validé.<\/p>\n          <p>Aucun RPK entre participants n'est autorisé sans accord explicite du staff ou des organisateurs. NoFear, powergaming et winRP restent interdits.<\/p>\n          <p>Les conflits pendant une animation ne se règlent pas en direct par chat HRP. Tout retour ou signalement se fait après l'événement via le canal prévu.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"section-important\">\n      <span class=\"tag\">!! IMPORTANT<\/span>\n      <h1 style=\"font-size:2.2rem; font-weight:900; color:#fff; margin-top:8px;\">Sanctions critiques.<\/h1>\n      <p style=\"color:var(--text-dim); margin-top:8px; max-width:700px;\">Les règles suivantes exposent à des sanctions lourdes : wipe, ban temporaire ou bannissement définitif. Aucune justification RP ne couvre un abus listé ici.<\/p>\n\n      <div class=\"critical-list\">\n        <a class=\"critical-item\" href=\"#rp-3\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 3.9 · Critique<\/span><span class=\"ci-title\">RPK<\/span><\/div>\n          <span class=\"ci-path\">Règlement RP · Captures &amp; scènes sensibles<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#rp-3\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 3.10 · Critique<\/span><span class=\"ci-title\">Vols d'armes uniques et de dojutsu<\/span><\/div>\n          <span class=\"ci-path\">Règlement RP · Captures &amp; scènes sensibles<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#rp-7\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 7.2 · Critique<\/span><span class=\"ci-title\">Coup d'état<\/span><\/div>\n          <span class=\"ci-path\">Règlement RP · Politique &amp; allégeance<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#rp-9\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 9.1 · Critique<\/span><span class=\"ci-title\">Infiltration<\/span><\/div>\n          <span class=\"ci-path\">Règlement RP · Infiltration &amp; règles diverses<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#rp-9\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 9.9 · Critique<\/span><span class=\"ci-title\">RP à caractère sexuel<\/span><\/div>\n          <span class=\"ci-path\">Règlement RP · Infiltration &amp; règles diverses<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#hrp-1\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 1.4 · Critique<\/span><span class=\"ci-title\">Sanctions lourdes et abus HRP<\/span><\/div>\n          <span class=\"ci-path\">Règlement HRP · Principes de base<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#hrp-5\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 5.3 · Critique<\/span><span class=\"ci-title\">Multi-comptes<\/span><\/div>\n          <span class=\"ci-path\">Règlement HRP · Identité RP &amp; comptes<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#hrp-6\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 6.2 · Critique<\/span><span class=\"ci-title\">Discrimination et harcèlement<\/span><\/div>\n          <span class=\"ci-path\">Règlement HRP · Comportement HRP<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#hrp-6\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 6.3 · Critique<\/span><span class=\"ci-title\">Publicité<\/span><\/div>\n          <span class=\"ci-path\">Règlement HRP · Comportement HRP<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#hrp-7\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 7.1 · Critique<\/span><span class=\"ci-title\">Échange et transaction<\/span><\/div>\n          <span class=\"ci-path\">Règlement HRP · Échanges &amp; transferts<\/span>\n        <\/a>\n        <a class=\"critical-item\" href=\"#hrp-8\">\n          <div class=\"ci-left\"><span class=\"art-num\">Art. 8.2 · Critique<\/span><span class=\"ci-title\">Contournement de sanctions<\/span><\/div>\n          <span class=\"ci-path\">Règlement HRP · Bugs &amp; contournements<\/span>\n        <\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"section-villages\">\n      <span class=\"tag\">VILLAGES<\/span>\n      <h1 style=\"font-size:2.2rem; font-weight:900; color:#fff; margin-top:8px;\">Lore des villages.<\/h1>\n      <p style=\"color:var(--text-dim); margin-top:8px; max-width:700px;\">L'histoire et l'identité des deux grandes puissances d'ORAJIN.<\/p>\n\n      <div class=\"village-grid\">\n        <a class=\"village-card\" href=\"#konoha\">\n          <span class=\"vc-tag\">VILLAGE<\/span>\n          <h3>Konoha<\/h3>\n          <p>Le village caché de la Feuille.<\/p>\n          <span class=\"vc-arrow\">Découvrir →<\/span>\n        <\/a>\n        <a class=\"village-card\" href=\"#ame\">\n          <span class=\"vc-tag\">VILLAGE<\/span>\n          <h3>Ame<\/h3>\n          <p>Le village caché de la Pluie.<\/p>\n          <span class=\"vc-arrow\">Découvrir →<\/span>\n        <\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"section-lore\">\n      <span class=\"tag\">CLANS<\/span>\n      <h1 style=\"font-size:2.2rem; font-weight:900; color:#fff; margin-top:8px;\">Lore des clans.<\/h1>\n      <p style=\"color:var(--text-dim); margin-top:8px; max-width:700px;\">Histoire, particularités et traditions de chaque clan d'ORAJIN.<\/p>\n\n      <div class=\"critical-list\" style=\"margin-top:20px;\">\n        <a class=\"critical-item lore-item\" href=\"#senju\">\n          <div class=\"ci-left\"><span class=\"ci-title\">Lore clan Senju<\/span><\/div>\n          <span class=\"ci-path\">Ouvrir →<\/span>\n        <\/a>\n        <a class=\"critical-item lore-item\" href=\"#hyuga\">\n          <div class=\"ci-left\"><span class=\"ci-title\">Lore clan Hyuga<\/span><\/div>\n          <span class=\"ci-path\">Ouvrir →<\/span>\n        <\/a>\n        <a class=\"critical-item lore-item\" href=\"#uchiha\">\n          <div class=\"ci-left\"><span class=\"ci-title\">Lore clan Uchiha<\/span><\/div>\n          <span class=\"ci-path\">Ouvrir →<\/span>\n        <\/a>\n        <a class=\"critical-item lore-item\" href=\"#salamandre\">\n          <div class=\"ci-left\"><span class=\"ci-title\">Lore clan Salamandre<\/span><\/div>\n          <span class=\"ci-path\">Ouvrir →<\/span>\n        <\/a>\n        <a class=\"critical-item lore-item\" href=\"#fuma\">\n          <div class=\"ci-left\"><span class=\"ci-title\">Lore clan Fūma<\/span><\/div>\n          <span class=\"ci-path\">Ouvrir →<\/span>\n        <\/a>\n        <a class=\"critical-item lore-item\" href=\"#hozuki\">\n          <div class=\"ci-left\"><span class=\"ci-title\">Lore clan Hōzuki<\/span><\/div>\n          <span class=\"ci-path\">Ouvrir →<\/span>\n        <\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"section-discord\">\n      <span class=\"tag\" style=\"color:#fed7aa;\">REJOINS LA COMMUNAUTÉ<\/span>\n      <h1 style=\"font-size:2.2rem; font-weight:900; color:#fff; margin-top:8px;\">Discord ORAJIN<\/h1>\n      <p style=\"color:rgba(255,255,255,0.85); margin-top:10px; max-width:600px; margin-left:auto; margin-right:auto;\">Tickets, annonces, suivi RP, déclarations de guerre, candidatures staff. Tout passe par Discord, c'est l'endroit officiel pour contacter l'équipe et la communauté.<\/p>\n      <a class=\"discord-cta\" href=\"https://discord.gg/VdfxuBenZ\" target=\"_blank\" rel=\"noopener\">Ouvrir le Discord<\/a>\n\n      <div class=\"discord-channels\">\n        <div class=\"ch\"><div class=\"name\">#tickets<\/div><div class=\"desc\">Ouvrir un ticket (contestation, déban, plainte)<\/div><\/div>\n        <div class=\"ch\"><div class=\"name\">#annonces<\/div><div class=\"desc\">Annonces officielles &amp; mises à jour du règlement<\/div><\/div>\n        <div class=\"ch\"><div class=\"name\">#suivi-rp<\/div><div class=\"desc\">Suivi RP, missions, validations<\/div><\/div>\n        <div class=\"ch\"><div class=\"name\">#vocaux-rp<\/div><div class=\"desc\">Vocaux RP, staff connectés<\/div><\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"section-staff\">\n      <span class=\"tag\">STAFF &amp; RÔLES<\/span>\n      <h1 style=\"font-size:2.2rem; font-weight:900; color:#fff; margin-top:8px;\">Qui contacter, et quand.<\/h1>\n      <p style=\"color:var(--text-dim); margin-top:8px; max-width:700px;\">Contacte l'équipe pour un besoin réel, pas pour gagner du confort. Tickets, DM et !pm ne sont pas des outils de raccourci.<\/p>\n\n      <div class=\"role-list\">\n        <div class=\"role-row\">\n          <div class=\"role-cat\">Administration<\/div>\n          <div class=\"role-body\"><strong>Gérant Serveur &amp; Gérant Staffs<\/strong><span>Décisions stratégiques, sanctions lourdes, validations majeures.<\/span><\/div>\n        <\/div>\n        <div class=\"role-row\">\n          <div class=\"role-cat\">Modération<\/div>\n          <div class=\"role-body\"><strong>Modérateurs<\/strong><span>Spectate RPK, arbitrage de scène, tickets courants.<\/span><\/div>\n        <\/div>\n        <div class=\"role-row\">\n          <div class=\"role-cat\">Animation<\/div>\n          <div class=\"role-body\"><strong>Animateurs<\/strong><span>Événements spéciaux, tournois, scénarios validés.<\/span><\/div>\n        <\/div>\n        <div class=\"role-row\">\n          <div class=\"role-cat\">Suivi RP<\/div>\n          <div class=\"role-body\"><strong>Maître de Jeu<\/strong><span>Validation des apprentissages, suivi des artefacts et pupilles.<\/span><\/div>\n        <\/div>\n        <div class=\"role-row\">\n          <div class=\"role-cat\">Communication<\/div>\n          <div class=\"role-body\"><strong>Community Manager<\/strong><span>Partenariats, candidatures stream, contenu officiel.<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n  \n    <div class=\"section-banner\" id=\"lore-start\">\n      <span class=\"tag\">LORE<\/span>\n      <h1>Lore d'Orajin.<\/h1>\n      <p>Histoire du monde, des villages et des clans qui façonnent ORAJIN.<\/p>\n    <\/div>\n<div class=\"section-banner\" id=\"villages\">\n      <span class=\"tag\">VILLAGES<\/span>\n      <h1>Lore des villages.<\/h1>\n      <p>L'histoire et l'identité des deux grandes puissances d'ORAJIN.<\/p>\n    <\/div>\n\n    <section class=\"lore-page\" id=\"konoha\">\n      <span class=\"subtag\">VILLAGE<\/span>\n      <h2>Konoha<\/h2>\n      <p class=\"subdesc\">Le village caché de la Feuille.<\/p>\n\n      <div class=\"lore-block\">\n        <h3>L'Ère des Clans et la Fondation<\/h3>\n        <p>Avant d'être un village, le monde ninja était plongé dans l'Ère des Clans, une époque de guerres continuelles où même les enfants mouraient au front. Parmi eux, deux clans ennemis juraient de se détruire : les puissants Senju, menés par le légendaire Hashirama et son Mokuton, et les redoutables Uchiha, dirigés par l'ambitieux Madara et son Sharingan.<\/p>\n        <p>Épuisés par les pertes, Hashirama et Madara signèrent un traité de paix historique. Rejoints par les clans Hyūga, Nara, Akimichi et Yamanaka, ils fondèrent Konohagakure, le premier village caché, basé sur la Volonté du Feu : une philosophie unissant les clans comme une seule famille à protéger. Hashirama devint le Premier Hokage. Mais Madara, consumé par la méfiance, finit par trahir le village et attaqua Konoha lors d'un duel à mort historique à la Vallée de la Fin, où il fut vaincu.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>L'Ère de l'Organisation<\/h3>\n        <p>À la mort d'Hashirama, et après une période de transition gérée par un système de régence pour maintenir la paix, Tobirama Senju devint le Deuxième Hokage. Homme froid, pragmatique et maître absolu du Suiton, il structura le village pour en faire une puissance militaire disciplinée.<\/p>\n        <ul>\n          <li><strong>Les Créations :<\/strong> Il fonda l'Académie Ninja pour former la relève et créa de nombreux Kinjutsu (techniques interdites) comme l'Edo Tensei.<\/li>\n          <li><strong>Le Piège Politique :<\/strong> Se méfiant de la haine héréditaire des Uchiha, il leur confia la Police de Konoha. Un honneur officiel qui lui permettait surtout de les parquer et de les surveiller dans l'ombre.<\/li>\n        <\/ul>\n        <p>Tobirama trouva finalement la mort lors d'une mission de sacrifice, emportant les détails exacts de ses derniers instants dans le mystère.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>La Situation Actuelle<\/h3>\n        <p>Après la disparition de Tobirama et dans un climat de tensions mondiales explosives, Kymone Senju a immédiatement repris le chapeau de Hokage. Calme, intelligent et respecté, Kymone a compris que la force brute ne suffirait pas à garantir l'avenir de la Feuille.<\/p>\n        <p>Le Troisième Hokage a alors lancé une ère axée sur la diplomatie et la stabilité économique. C'est sous son impulsion que la ville d'Ame est devenue le carrefour commercial mondial indispensable que tout le monde connaît, liant Konoha, Kiri et Oto.<\/p>\n        <p><strong>Résultat pour le RP :<\/strong> Konoha surveille de très près ce réseau économique. Mais alors que le village pense maintenir l'équilibre du monde, le silence radio récent de leur espion à Ame et les tensions géopolitiques s'apprêtent à mettre la Volonté du Feu à rude épreuve.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"lore-page\" id=\"ame\">\n      <span class=\"subtag\">VILLAGE<\/span>\n      <h2>Ame<\/h2>\n      <p class=\"subdesc\">Le village caché de la Pluie.<\/p>\n\n      \n\n      <div class=\"lore-block\">\n        <h3>L'Âge d'Or : Le Carrefour Commercial du Monde Ninja<\/h3>\n        <p>Il y a encore peu de temps, Ame n'était pas un village de guerre, mais le poumon économique de la région. Profitant de sa position géographique centrale entre les grandes nations, la cité s'était transformée en une immense zone commerciale et une plaque tournante stratégique.<\/p>\n        <p>Sous ses structures métalliques et sa pluie éternelle, le centre commercial d'Ame voyait transiter des fortunes : vivres, technologies, armes et matières premières. C'était simple : tout ce qui circulait dans le monde ninja passait, à un moment ou un autre, par Ame. Cette opulence approvisionnait directement le Pays de l'Eau et Kirigakure, totalement dépendants de ce flux pour survivre.<\/p>\n        <p>À cette époque, la sécurité y était stricte, surveillée de près par les grandes nations, et notamment par un espion d'élite de Konoha, infiltré au cœur du centre commercial pour surveiller les flux de richesses et maintenir l'équilibre.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Le Coup d'État<\/h3>\n        <p>L'âge d'or s'est effondré brutalement. Attirés par les richesses colossales d'Ame, un syndicat de bandits et de mercenaires surarmés a lancé un assaut surprise et violent. Le centre commercial a été pris en otage, les autorités locales balayées, et la ville fortifiée du jour au lendemain.<\/p>\n        <p>Les nouveaux maîtres d'Ame ont instauré un blocus total : plus rien ne sort, plus rien ne rentre.<\/p>\n        <ul>\n          <li><strong>Le silence de Konoha :<\/strong> Juste après la prise de la ville par les mercenaires, l'espion de Konoha a réussi à envoyer un ultime message de détresse signalant la chute d'Ame. Depuis ? Silence radio total. Konoha s'est muré dans le mutisme, abandonnant la zone à son triste sort pour des raisons obscures.<\/li>\n          <li><strong>L'effet papillon :<\/strong> En coupant les vivres, les mercenaires d'Ame ont provoqué, par ricochet, l'effondrement interne, la guerre civile et la famine de Kirigakure, forçant ses clans (Hōzuki, Fūma, Salamandre) à fuir vers le Pays Neutre, sans maison ni repères.<\/li>\n        <\/ul>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>La Situation Actuelle<\/h3>\n        <p>Aujourd'hui, Ame est une forteresse en apparence imprenable, contrôlée d'une main de fer par les bandits. Mais ce que ces criminels ignorent, c'est qu'ils célèbrent leur victoire dans un tombeau ouvert, orchestré par un homme aux deux visages.<\/p>\n        <p>Dans le Pays Neutre, un homme mystérieux nommé Kagehito a rassemblé les clans de Kiri brisés pour leur proposer de conquérir Ame afin d'en faire leur nouveau foyer. Quelque chose ne tourne pas rond avec Kagehito… Cet homme n'est qu'un reflet, une ombre qui cache un nom bien plus lourd de sens. Il ne nous dit pas tout sur ce qu'il est vraiment.<\/p>\n        <p>Le seul à être dans la confidence est son second, le chef du clan de la Salamandre. Ensemble, ils mènent une guerre d'usure secrète contre Ame :<\/p>\n        <ul>\n          <li><strong>L'Empoisonnement de l'Eau :<\/strong> Sur les ordres directs de Kagehito, les ninjas du clan de la Salamandre infiltrent régulièrement les tuyauteries d'Ame pour distiller un poison lent dans les réserves d'eau. Il ne tue pas instantanément, mais affaiblit les mercenaires jour après jour, les rendant malades et paranoïaques.<\/li>\n          <li><strong>Le Confinement Souterrain :<\/strong> Toutes les issues, égouts et galeries souterraines menant à l'extérieur d'Ame ont été scellés ou bloqués en secret.<\/li>\n        <\/ul>\n        <p><strong>Résultat pour le RP :<\/strong> Ame est devenue un ratelier. Les bandits à l'intérieur s'affaiblissent sans comprendre pourquoi, tandis que les clans réfugiés (Hōzuki, Fūma, Salamandre), poussés par « Kagehito », s'apprêtent à lancer un assaut sanglant pour reprendre la ville.<\/p>\n      <\/div>\n    \n    <\/section>\n\n    <div class=\"section-banner\" id=\"clans\">\n      <span class=\"tag\">CLANS · KONOHA<\/span>\n      <h1>Clans de Konoha.<\/h1>\n      <p>Les grandes familles du village caché de la Feuille.<\/p>\n    <\/div>\n\n    <section class=\"lore-page\" id=\"senju\">\n      <span class=\"subtag\">CLAN<\/span>\n      <h2>Senju<\/h2>\n      <p class=\"subdesc\">Les fondateurs de la Volonté du Feu.<\/p>\n\n      <div class=\"lore-block\">\n        <h3>Un clan guerrier complet<\/h3>\n        <p>Le Clan Senju est l'un des plus anciens clans guerriers de l'Ère des Clans. Réputés pour leur endurance, leur immense réserve de chakra et leur polyvalence au combat, les Senju étaient capables de s'adapter à tous les styles de guerre. Là où d'autres clans se spécialisaient dans une seule discipline, les Senju formaient des shinobi complets : stratèges, médecins, combattants et chefs militaires.<\/p>\n        <p>Durant des décennies, ils furent les ennemis jurés du Clan Uchiha. Leurs affrontements ont ravagé des régions entières et coûté la vie à des centaines de guerriers, y compris des enfants envoyés au front dès leur plus jeune âge.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Hashirama, le rêve d'une paix durable<\/h3>\n        <p>Malgré cette haine, le chef des Senju, Hashirama Senju, rêvait d'un monde différent. Contrairement aux anciens chefs de clan, il croyait qu'une paix durable était possible si les clans abandonnaient leur vengeance.<\/p>\n        <p>Hashirama Senju était connu comme le shinobi le plus puissant de son époque. Son Mokuton faisait de lui une véritable force de la nature capable de transformer le champ de bataille en forêt vivante.<\/p>\n        <p>Mais sa véritable force résidait dans sa capacité à rassembler les autres.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>La fondation de Konoha<\/h3>\n        <p>Après des années de guerre, Hashirama conclut un traité historique avec Madara Uchiha. Ensemble, ils fondèrent Konohagakure aux côtés des clans Hyūga et Uchiha.<\/p>\n        <p>Hashirama devint alors le Premier Hokage et imposa la philosophie de la <strong>Volonté du Feu<\/strong> : le village devait être une famille où chaque génération protège la suivante.<\/p>\n        <p>Cependant, son rêve se fissura lorsque Madara commença à se méfier du système politique de Konoha. Leur affrontement final à la Vallée de la Fin marqua la fin de leur amitié et le début d'une méfiance durable entre Senju et Uchiha.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Tobirama et l'ère du pragmatisme<\/h3>\n        <p>Après la mort d'Hashirama et une courte régence, Tobirama Senju devint le Deuxième Hokage. Là où son frère gouvernait avec idéalisme, Tobirama gouvernait avec pragmatisme.<\/p>\n        <p>Craignant les conflits internes et les menaces extérieures, il transforma Konoha en véritable puissance militaire organisée :<\/p>\n        <ul>\n          <li>création de l'Académie Ninja ;<\/li>\n          <li>structuration des équipes shinobi ;<\/li>\n          <li>développement de nombreux jutsu interdits ;<\/li>\n          <li>création d'institutions destinées à maintenir l'ordre.<\/li>\n        <\/ul>\n        <p>Mais Tobirama nourrissait une profonde méfiance envers les Uchiha. Persuadé que leurs émotions pouvaient les rendre instables, il leur confia la Police Militaire de Konoha. Officiellement, c'était un signe de confiance. En réalité, cela permettait aussi de les éloigner du pouvoir politique central. Cette décision marqua durablement les relations entre les deux clans.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Les Senju Aujourd'hui<\/h3>\n        <p>Avec les années, le clan Senju est devenu moins visible comme entité unique, beaucoup de ses membres s'étant mêlés aux autres familles du village. Pourtant, leur influence reste partout dans Konoha :<\/p>\n        <ul>\n          <li>la Volonté du Feu ;<\/li>\n          <li>les institutions du village ;<\/li>\n          <li>la diplomatie ;<\/li>\n          <li>la stabilité politique.<\/li>\n        <\/ul>\n        <p>Depuis l'arrivée de Kymone Senju au poste de Troisième Hokage, les Senju cherchent désormais à préserver la paix mondiale autant que la puissance militaire de Konoha.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"lore-page\" id=\"hyuga\">\n      <span class=\"subtag\">CLAN<\/span>\n      <h2>Hyuga<\/h2>\n      <p class=\"subdesc\">Les gardiens du Byakugan.<\/p>\n\n      <div class=\"lore-block\">\n        <h3>Les gardiens du Byakugan<\/h3>\n        <p>Le Clan Hyūga était déjà l'un des clans les plus puissants de Konoha durant le règne de Tobirama Senju.<\/p>\n        <p>Le Byakugan était considéré comme un trésor sacré.<\/p>\n        <p>Le clan vivait selon :<\/p>\n        <ul>\n          <li>la discipline ;<\/li>\n          <li>l'honneur ;<\/li>\n          <li>la protection du sang Hyūga.<\/li>\n        <\/ul>\n        <p>Les Hyūga méprisaient les méthodes des Fūma :<\/p>\n        <ul>\n          <li>poisons ;<\/li>\n          <li>pièges ;<\/li>\n          <li>assassinats dans le dos.<\/li>\n        <\/ul>\n        <p>Pour eux, les Fūma n'étaient que des mercenaires sans principes.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Les opérations dans Ame<\/h3>\n        <p>Tobirama utilisa souvent les Hyūga pour des missions secrètes dans le Pays de la Pluie.<\/p>\n        <p>Grâce au Byakugan :<\/p>\n        <ul>\n          <li>les cachettes Fūma étaient découvertes ;<\/li>\n          <li>les espions étaient traqués ;<\/li>\n          <li>les embuscades devenaient inutiles.<\/li>\n        <\/ul>\n        <p>Les Fūma commencèrent alors à développer une obsession pour le Byakugan.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Le crime impardonnable<\/h3>\n        <p>Durant une mission frontalière, un membre de la branche secondaire Hyūga disparut.<\/p>\n        <p>Quelques semaines plus tard, des rapports confirmèrent l'horreur : un Fūma utilisait un Byakugan volé.<\/p>\n        <p>Pour le clan Hyūga, c'était pire que la mort. Le conseil du clan considéra cela comme :<\/p>\n        <ul>\n          <li>une profanation ;<\/li>\n          <li>une humiliation ;<\/li>\n          <li>une menace pour Konoha.<\/li>\n        <\/ul>\n        <p>Même Tobirama autorisa discrètement une opération de représailles.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>La nuit du Val écarlate<\/h3>\n        <p>Une unité Hyūga pénétra dans une base supposée abriter les responsables du vol.<\/p>\n        <p>Mais les renseignements étaient erronés. Le lieu était un refuge de survivants Fūma.<\/p>\n        <p>Quand les Hyūga réalisèrent leur erreur, il était déjà trop tard.<\/p>\n        <p>L'affaire fut étouffée par Konoha afin d'éviter un scandale diplomatique avec Ame. Mais plusieurs Hyūga présents cette nuit-là furent traumatisés.<\/p>\n        <p>Depuis ce jour, certains membres du clan pensent : « Le Byakugan apporte autant de malheur que de puissance. »<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Chez les Hyūga<\/h3>\n        <p>Les Fūma sont vus comme :<\/p>\n        <ul>\n          <li>des voleurs d'yeux ;<\/li>\n          <li>des ennemis du Byakugan.<\/li>\n        <\/ul>\n        <p>Même des décennies plus tard, certains Hyūga craignent encore que les Fūma tentent de voler leurs yeux après leur mort.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"lore-page\" id=\"uchiha\">\n      <span class=\"subtag\">CLAN<\/span>\n      <h2>Uchiha<\/h2>\n      <p class=\"subdesc\">Le clan aux yeux rouges.<\/p>\n\n      <div class=\"lore-block\">\n        <h3>Origines du Clan<\/h3>\n        <p>Le Clan Uchiha était considéré comme le clan le plus dangereux de l'Ère des Clans. Experts du Katon et maîtres du Sharingan, les Uchiha étaient des combattants redoutés dans tout le monde ninja.<\/p>\n        <p>Leur puissance venait autant de leur talent naturel que de leur intensité émotionnelle. Les Uchiha vivaient tout avec une extrême profondeur : la loyauté, la haine, l'amour et la vengeance.<\/p>\n        <p>C'est cette intensité qui alimentait leur Sharingan, un dôjutsu capable :<\/p>\n        <ul>\n          <li>d'anticiper les mouvements ennemis ;<\/li>\n          <li>de copier des techniques ;<\/li>\n          <li>de lancer des genjutsu puissants ;<\/li>\n          <li>et de dominer le combat psychologique.<\/li>\n        <\/ul>\n        <p>Durant des générations, les Uchiha affrontèrent les Senju dans une guerre sans fin qui forgea leur réputation sanglante.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>L'Homme qui Refusa la Paix<\/h3>\n        <p>Madara Uchiha dirigeait les Uchiha lors de la création de Konoha. Guerrier exceptionnel et rival direct d'Hashirama, il accepta la paix dans l'espoir d'offrir un avenir meilleur à son clan.<\/p>\n        <p>Mais avec le temps, Madara développa une profonde méfiance envers le système du village.<\/p>\n        <p>Il voyait les Senju prendre progressivement le contrôle politique tandis que les Uchiha étaient maintenus à distance des véritables décisions. L'influence grandissante de Tobirama renforça encore ses craintes.<\/p>\n        <p>Persuadé que les Uchiha finiraient marginalisés, Madara quitta le village avant de revenir défier Hashirama à la Vallée de la Fin.<\/p>\n        <p>Sa défaite transforma son nom en légende… mais aussi en symbole de division.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Les Uchiha Aujourd'hui<\/h3>\n        <p>Le clan Uchiha reste l'un des piliers militaires de Konoha, mais les tensions avec le pouvoir existent toujours dans l'ombre.<\/p>\n        <p>Le clan est désormais partagé entre plusieurs courants :<\/p>\n        <ul>\n          <li>ceux qui veulent rester fidèles au village ;<\/li>\n          <li>ceux qui réclament davantage d'influence politique ;<\/li>\n          <li>et ceux qui pensent que Madara avait raison depuis le début.<\/li>\n        <\/ul>\n        <p>Même après des années, le nom Uchiha continue d'inspirer autant le respect que la crainte dans le monde ninja.<\/p>\n      <\/div>\n    <\/section>\n\n    <div class=\"section-banner\" id=\"clans-ame\">\n      <span class=\"tag\">CLANS · AME<\/span>\n      <h1>Clans d'Ame.<\/h1>\n      <p>Les familles qui façonnent le village caché de la Pluie.<\/p>\n    <\/div>\n\n    <section class=\"lore-page\" id=\"salamandre\">\n      <span class=\"subtag\">CLAN<\/span>\n      <h2>Salamandre<\/h2>\n      <p class=\"subdesc\">Les fantômes de la pluie.<\/p>\n\n      <div class=\"lore-block\">\n        <h3>Nés dans les profondeurs de Kirigakure<\/h3>\n        <p>Né dans les profondeurs humides de Kirigakure, le clan Salamandre était autrefois chargé des missions les plus discrètes et impitoyables du village. Experts en poisons, infiltrations et combats dans les environnements toxiques, leurs ninjas étaient redoutés jusque dans les grandes nations.<\/p>\n        <p>Là où les autres clans frappaient avec puissance, les Salamandre préféraient la lente agonie…<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>L'exode et la quête de vengeance<\/h3>\n        <p>Quand la chute d'Ame provoqua l'effondrement de Kirigakure, le clan Salamandre fut l'un des premiers à comprendre que leur village était condamné. La famine, les guerres internes et les trahisons forcèrent le clan à abandonner sa terre natale pour errer dans le Pays Neutre, vivant dans l'ombre et la pluie.<\/p>\n        <p>Mais contrairement aux autres réfugiés, les Salamandre ne cherchaient pas simplement un refuge. Ils cherchaient une vengeance.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Le pacte avec Kagehito<\/h3>\n        <p>C'est à ce moment qu'apparut Kagehito, l'homme au visage caché. Alors que beaucoup doutaient de lui, le chef du clan Salamandre fut le seul à connaître une partie de la vérité derrière cet homme mystérieux. Un pacte secret fut conclu entre eux : Ame tomberait, peu importe le prix.<\/p>\n        <p>Depuis ce jour, le clan Salamandre mène une guerre silencieuse contre la cité fortifiée d'Ame.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Le Poison de la Pluie<\/h3>\n        <p>Profitant des canalisations et des anciennes galeries techniques de la ville, les ninjas Salamandre infiltrent régulièrement Ame pour verser un poison lent dans les réserves d'eau. Invisible, inodore, ce venin ne tue pas immédiatement… il affaiblit lentement les corps et détruit les esprits.<\/p>\n        <p>Les mercenaires deviennent paranoïaques, violents et incapables de distinguer alliés et ennemis.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Les Fantômes des Égouts<\/h3>\n        <p>Le clan connaît les sous-sols d'Ame mieux que personne. Anciennes voies commerciales, conduits abandonnés, tunnels oubliés… tout a été secrètement condamné par les Salamandre afin d'enfermer les bandits dans leur propre forteresse.<\/p>\n        <p>Chaque sortie bouchée rapproche la ville de sa chute.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Leur But<\/h3>\n        <p>Pour les Salamandre, reprendre Ame n'est pas une simple guerre territoriale. C'est la naissance d'un nouveau foyer pour les survivants de Kiri. Ils veulent transformer cette ville corrompue en un royaume bâti sur la peur, le silence et le contrôle.<\/p>\n        <p>Mais certains murmurent que le clan Salamandre prépare quelque chose de bien plus sombre encore…<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"lore-page\" id=\"fuma\">\n      <span class=\"subtag\">CLAN<\/span>\n      <h2>Fūma<\/h2>\n      <p class=\"subdesc\">Le clan oublié de la pluie.<\/p>\n\n      <div class=\"lore-block\">\n        <h3>Le clan oublié de la pluie<\/h3>\n        <p>Le Clan Fūma vivait dans le Pays de la Pluie bien avant la création officielle d'Ame. Dans les marécages, les ruines et les villages noyés par la guerre, les Fūma étaient des survivants.<\/p>\n        <p>Ils n'étaient ni riches ni nobles. Leur force venait de :<\/p>\n        <ul>\n          <li>l'espionnage ;<\/li>\n          <li>les poisons ;<\/li>\n          <li>les fils de chakra ;<\/li>\n          <li>les assassinats silencieux ;<\/li>\n          <li>les armes géantes typiques des Fūma.<\/li>\n        <\/ul>\n        <p>Quand les grands villages commencèrent à se former, la Pluie devint un champ de bataille entre les puissances. Et les Fūma furent utilisés comme des chiens de guerre.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>La guerre contre le clan Hyuga<\/h3>\n        <p>Durant l'époque de Tobirama Senju, des membres du clan Hyūga cherchaient à éliminer tous les réseaux d'espions autour du Pays du Feu. Les Fūma étaient alors considérés comme la plus grande menace d'infiltration.<\/p>\n        <p>Les Hyūga furent envoyés avec des unités traqueuses grâce au Byakugan. Pour les Fūma, les Hyūga étaient des monstres :<\/p>\n        <ul>\n          <li>impossibles à surprendre ;<\/li>\n          <li>capables de voir à travers les cachettes ;<\/li>\n          <li>capables de détecter les pièges.<\/li>\n        <\/ul>\n        <p>Les pertes Fūma devinrent énormes.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Le Byakugan volé<\/h3>\n        <p>Un chef Fūma nommé Jinpachi Fūma jura de briser la domination des Hyūga.<\/p>\n        <p>Pendant une bataille dans la pluie noire d'Ame, il captura un Hyūga de la branche secondaire. Au lieu de le tuer, les Fūma volèrent un de ses Byakugan. L'œil fut transplanté à Jinpachi.<\/p>\n        <p>Le clan pensait obtenir une arme absolue. Mais le Byakugan détruisait lentement son corps :<\/p>\n        <ul>\n          <li>migraines ;<\/li>\n          <li>saignements ;<\/li>\n          <li>folie ;<\/li>\n          <li>perte de contrôle du chakra.<\/li>\n        <\/ul>\n        <p>Malgré cela, Jinpachi réussit plusieurs assassinats contre Konoha. Les Hyūga jurèrent alors d'exterminer tous les responsables.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Le massacre de la pluie rouge<\/h3>\n        <p>Les Hyūga découvrirent une cache Fūma dans le Pays de l'Eau. Sous les ordres secrets du chef de clan, une unité Hyūga attaqua de nuit.<\/p>\n        <p>Mais l'information était fausse : la majorité des combattants avaient quitté la zone. Le massacre tua surtout :<\/p>\n        <ul>\n          <li>des civils ;<\/li>\n          <li>des vieillards ;<\/li>\n          <li>des enfants Fūma.<\/li>\n        <\/ul>\n        <p>Mais la femme de Jinpachi s'y trouvait et fut exécutée devant tous les membres du clan Hyūga alors qu'elle était enceinte.<\/p>\n        <p>La pluie mélangée au sang transforma les rues rouges pendant plusieurs jours.<\/p>\n        <p>Depuis ce jour, les Fūma appellent les Hyūga : « Les démons aux yeux blancs. »<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>La haine entre les deux clans<\/h3>\n        <p>Chez les Fūma, les Hyūga sont vus comme :<\/p>\n        <ul>\n          <li>des nobles protégés par Konoha ;<\/li>\n          <li>des assassins hypocrites ;<\/li>\n          <li>les responsables du massacre de leur peuple.<\/li>\n        <\/ul>\n        <p>Les enfants Fūma apprennent très jeunes à :<\/p>\n        <ul>\n          <li>aveugler un Byakugan ;<\/li>\n          <li>combattre sans être vus ;<\/li>\n          <li>tuer rapidement un Hyūga.<\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n\n    <section class=\"lore-page\" id=\"hozuki\">\n      <span class=\"subtag\">CLAN<\/span>\n      <h2>Hōzuki<\/h2>\n      <p class=\"subdesc\">L'exil de la Brume vers la Pluie.<\/p>\n\n      <div class=\"lore-block\">\n        <h3>Un clan prospère à Kiri<\/h3>\n        <p>Pendant longtemps, le Clan Hōzuki fut l'un des clans les plus particuliers et les plus respectés de Kiri. Réputés pour leurs techniques uniques, leur maîtrise exceptionnelle de l'eau et leur capacité à transformer leur corps en une forme liquide, les Hōzuki occupaient une place importante au sein de la société du Pays de l'Eau.<\/p>\n        <p>Leur talent faisait d'eux des shinobis particulièrement adaptés aux missions d'infiltration, d'assassinat et de reconnaissance. Leur affinité avec l'eau leur permettait également de jouer un rôle important dans la surveillance des côtes, des voies maritimes et des infrastructures portuaires de Kiri.<\/p>\n        <p>Pendant des générations, les Hōzuki vécurent ainsi au rythme de la brume et de la mer, leur nom étant profondément associé au village caché de Kiri.<\/p>\n        <p>Mais cette prospérité ne devait pas durer éternellement.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>La crise économique<\/h3>\n        <p>À mesure que les ressources se raréfièrent et que les échanges commerciaux diminuèrent, le Pays de l'Eau entra dans une période de difficultés économiques sans précédent.<\/p>\n        <p>Les missions se firent moins nombreuses. Les revenus du village diminuèrent et les activités commerciales qui faisaient autrefois vivre de nombreuses familles commencèrent à disparaître.<\/p>\n        <p>Les conséquences furent particulièrement importantes pour les clans dont les activités dépendaient directement de la prospérité de Kiri.<\/p>\n        <p>Le Clan Hōzuki ne fut pas épargné. Les ports perdaient progressivement leur activité, les routes commerciales étaient abandonnées et les missions maritimes se raréfiaient. Les familles Hōzuki qui avaient longtemps bénéficié de leur réputation et de leur expertise commencèrent elles aussi à connaître des difficultés.<\/p>\n        <p>Les richesses accumulées durant les années de prospérité ne suffisaient plus. Peu à peu, le clan comprit que le problème n'était plus temporaire.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>Les tensions au sein du clan<\/h3>\n        <p>Dans un premier temps, les anciens du clan refusèrent d'envisager un départ. Kiri était leur maison. C'était là que leurs ancêtres étaient nés, avaient vécu et étaient morts. Abandonner le Pays de l'Eau revenait, pour certains, à abandonner une partie de leur identité.<\/p>\n        <p>Mais les années passèrent et la situation ne s'améliora pas. Les discussions devinrent de plus en plus nombreuses au sein du clan. Certains Hōzuki souhaitaient rester à Kiri, convaincus que le village finirait par retrouver sa prospérité. D'autres estimaient que continuer à attendre ne ferait qu'aggraver la situation et risquait de condamner les générations futures.<\/p>\n        <p>La question n'était plus de savoir s'ils aimaient Kiri. La question était de savoir s'ils pouvaient encore y construire un avenir.<\/p>\n        <p>Finalement, après de longues discussions entre les familles du clan, une décision historique fut prise. Une partie importante du Clan Hōzuki quitterait le Pays de l'Eau.<\/p>\n      <\/div>\n\n      <div class=\"lore-block\">\n        <h3>L'exil vers Ame<\/h3>\n        <p>Le départ ne fut pas simple. Pour les Hōzuki, quitter Kiri signifiait abandonner les terres de leurs ancêtres. Des maisons furent laissées derrière eux, des possessions furent abandonnées et certains membres du clan choisirent de rester malgré les difficultés.<\/p>\n        <p>Les familles ayant décidé de partir préparèrent alors leur voyage. Leur destination fut le Pays de la Pluie.<\/p>\n        <p>À cette époque, Ame connaissait une période de reconstruction et de développement. Sa position géographique en faisait un territoire intéressant pour les voyageurs, les commerçants et les shinobis à la recherche de nouvelles opportunités.<\/p>\n        <p>Là où Kiri semblait s'enfoncer dans une période d'incertitude, Ame représentait une possibilité de recommencer.<\/p>\n        <p>Les Hōzuki partirent donc avec peu de certitudes, mais avec une conviction commune : ils devaient assurer l'avenir de leur clan.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"lore-page\" id=\"clans-ame-placeholder\">\n      <span class=\"subtag\">CLAN<\/span>\n      <h2>D'autres à venir<\/h2>\n      <p class=\"subdesc\">D'autres clans d'Ame seront ajoutés ici.<\/p>\n      <div class=\"lore-block\">\n        <p class=\"placeholder\">Envoie-moi le lore d'un autre clan d'Ame et je créerai sa section ici.<\/p>\n      <\/div>\n    <\/section>\n  <\/main>\n<\/div>\n\n<footer>\n  © Orajin Community — Tous droits réservés\n<\/footer>\n\n<script>\n  // Surbrillance du lien actif dans le sommaire au scroll\n  const links = document.querySelectorAll('nav.sommaire a');\n  const sections = document.querySelectorAll('main section');\n\n  const observer = new IntersectionObserver((entries) => {\n    entries.forEach(entry => {\n      const id = entry.target.getAttribute('id');\n      const link = document.querySelector(`nav.sommaire a[href=\"#${id}\"]`);\n      if (!link) return;\n      if (entry.isIntersecting){\n        links.forEach(l => l.classList.remove('active'));\n        link.classList.add('active');\n      }\n    });\n  }, { rootMargin: '-20% 0px -70% 0px' });\n\n  sections.forEach(sec => observer.observe(sec));\n<\/script>\n\n\n\n\n<script>\n  // Navigation interne : les liens entre pages passent par la barre du haut, les ancres défilent dans la page.\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a'); if(!a) return;\n    var h = a.getAttribute('href') || '';\n    var m = h.match(/^(index|reglement-orajin|lore-orajin|boutique-orajin)\\.html(?:#(.*))?$/);\n    if(m){\n      e.preventDefault();\n      var map = {'index':'accueil','reglement-orajin':'reglement','lore-orajin':'lore','boutique-orajin':'boutique'};\n      parent.postMessage({orajinTab: map[m[1]], anchor: m[2] || ''}, '*');\n      return;\n    }\n    if(h.charAt(0) === '#'){\n      e.preventDefault();\n      var el = h.length > 1 ? document.getElementById(h.slice(1)) : null;\n      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});\n      return;\n    }\n    if(/^https?:/.test(h)){ a.target = '_blank'; a.rel = 'noopener'; }\n  });\n<\/script>\n<\/body>\n<\/
