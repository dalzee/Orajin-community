\n\n  <!-- SOMMAIRE -->\n  <nav class=\"sommaire\" id=\"sommaire\">\n    <h2>Général<\/h2>\n    <ul>\n      <li><a href=\"#introduction\"><span class=\"num\">00<\/span>Comment lire le règlement<\/a><\/li>\n      <li><a href=\"#legend\"><span class=\"num\">01<\/span>Niveaux de gravité<\/a><\/li>\n    <\/ul>\n\n    <h2>Règles RP<\/h2>\n    <ul>\n      <li><a href=\"#rp-1\"><span class=\"num\">01<\/span>Cadre général<\/a><\/li>\n      <li><a href=\"#rp-2\"><span class=\"num\">02<\/span>Équipement &amp; identification<\/a><\/li>\n      <li><a href=\"#rp-3\"><span class=\"num\">03<\/span>Captures &amp; scènes sensibles<\/a><\/li>\n      <li><a href=\"#rp-4\"><span class=\"num\">04<\/span>Batailles &amp; guerres<\/a><\/li>\n      <li><a href=\"#rp-5\"><span class=\"num\">05<\/span>Commandes &amp; outils RP<\/a><\/li>\n      <li><a href=\"#rp-6\"><span class=\"num\">06<\/span>Techniques sensibles<\/a><\/li>\n      <li><a href=\"#rp-7\"><span class=\"num\">07<\/span>Politique &amp; allégeance<\/a><\/li>\n      <li><a href=\"#rp-8\"><span class=\"num\">08<\/span>Progression RP<\/a><\/li>\n      <li><a href=\"#rp-9\"><span class=\"num\">09<\/span>Infiltration &amp; règles diverses<\/a><\/li>\n      <li><a href=\"#rp-10\"><span class=\"num\">10<\/span>Subjutsu<\/a><\/li>\n      <li><a href=\"#rp-11\"><span class=\"num\">11<\/span>Mentalité RP<\/a><\/li>\n    <\/ul>\n\n    <h2>Règles HRP<\/h2>\n    <ul>\n      <li><a href=\"#hrp-1\"><span class=\"num\">01<\/span>Principes de base<\/a><\/li>\n      <li><a href=\"#hrp-2\"><span class=\"num\">02<\/span>Tickets &amp; procédures<\/a><\/li>\n      <li><a href=\"#hrp-3\"><span class=\"num\">03<\/span>Cohérence RP &amp; scènes<\/a><\/li>\n      <li><a href=\"#hrp-4\"><span class=\"num\">04<\/span>Vocal &amp; communications<\/a><\/li>\n      <li><a href=\"#hrp-5\"><span class=\"num\">05<\/span>Identité RP &amp; comptes<\/a><\/li>\n      <li><a href=\"#hrp-6\"><span class=\"num\">06<\/span>Comportement HRP<\/a><\/li>\n      <li><a href=\"#hrp-7\"><span class=\"num\">07<\/span>Échanges &amp; transferts<\/a><\/li>\n      <li><a href=\"#hrp-8\"><span class=\"num\">08<\/span>Bugs &amp; contournements<\/a><\/li>\n      <li><a href=\"#hrp-9\"><span class=\"num\">09<\/span>Staff &amp; confidentialité<\/a><\/li>\n      <li><a href=\"#hrp-10\"><span class=\"num\">10<\/span>Suivi RP &amp; événements<\/a><\/li>\n    <\/ul>\n\n    <h2>Autres<\/h2>\n    <ul>\n      <li><a href=\"#section-important\">→ Sanctions critiques<\/a><\/li>\n      <li><a href=\"#section-discord\">→ Discord<\/a><\/li>\n      <li><a href=\"#section-staff\">→ Staff &amp; contacts<\/a><\/li>\n    <\/ul>\n    <h2>Lore · Villages<\/h2>\n    <ul>\n      <li><a href=\"#konoha\">Konoha<\/a><\/li>\n      <li><a href=\"#ame\">Ame<\/a><\/li>\n    <\/ul>\n    <h2>Lore · Clans Konoha<\/h2>\n    <ul>\n      <li><a href=\"#senju\">Senju<\/a><\/li>\n      <li><a href=\"#hyuga\">Hyuga<\/a><\/li>\n      <li><a href=\"#uchiha\">Uchiha<\/a><\/li>\n    <\/ul>\n    <h2>Lore · Clans Ame<\/h2>\n    <ul>\n      <li><a href=\"#salamandre\">Salamandre<\/a><\/li>\n      <li><a href=\"#fuma\">Fūma<\/a><\/li>\n      <li><a href=\"#hozuki\">Hōzuki<\/a><\/li>\n    <\/ul>\n  <\/nav>\n\n  <!-- CONTENU -->\n  <main>\n\n    <section id=\"introduction\">\n      <h2>00. Comment lire le règlement<\/h2>\n      <p><strong>Le cadre de la communauté.<\/strong><\/p>\n      <p>Le règlement ORAJIN pose un cadre clair pour le jeu, les scènes sensibles, les procédures et le comportement hors-RP. Tu joues d'abord, tu contestes ensuite avec la bonne procédure et les bonnes preuves.<\/p>\n\n      <div class=\"legend-grid\" style=\"margin-top:20px;\">\n        <div class=\"legend-item low\">\n          <strong>Par thèmes<\/strong>\n          <p>Utilise le sommaire pour parcourir un bloc complet (cadre général, batailles, etc).<\/p>\n        <\/div>\n        <div class=\"legend-item low\">\n          <strong>Par article<\/strong>\n          <p>Chaque règle a un numéro stable. Cite « Art. 3.9 · RPK » pour être précis.<\/p>\n        <\/div>\n        <div class=\"legend-item mid\">\n          <strong>Avant ticket<\/strong>\n          <p>Vérifie la règle : identifie l'article concerné avant toute plainte ou contestation.<\/p>\n        <\/div>\n        <div class=\"legend-item high\">\n          <strong>En scène<\/strong>\n          <p>Joue d'abord : toute contestation se fait après la scène, jamais pendant.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"legend\">\n      <h2>01. Niveaux de gravité<\/h2>\n      <div class=\"legend-grid\">\n        <div class=\"legend-item low\">\n          <strong>Niveau 01 · Info — Cadre normal<\/strong>\n          <p>Règles de fonctionnement courant. Reste cohérent et fairplay.<\/p>\n        <\/div>\n        <div class=\"legend-item mid\">\n          <strong>Niveau 02 · Modérée — Avertissement<\/strong>\n          <p>Sanction staff possible, annulation de scène, warn.<\/p>\n        <\/div>\n        <div class=\"legend-item high\">\n          <strong>Niveau 03 · Sévère — RPK / kick possible<\/strong>\n          <p>Exposition au RPK, void, sanctions cumulables.<\/p>\n        <\/div>\n        <div class=\"legend-item high\">\n          <strong>Niveau 04 · Critique — Bannissement<\/strong>\n          <p>Sanctions lourdes, jusqu'au bannissement définitif.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- RP -->\n    <div class=\"section-banner\">\n      <span class=\"tag\">RP<\/span>\n      <h1>Règlement RP.<\/h1>\n      <p>Le cadre en jeu : combats, captures, techniques, politique et progression.<\/p>\n    <\/div>\n\n    <section id=\"rp-1\">\n      <h2>01. Cadre général <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Les fondations du RP : fairplay, cohérence, métagaming, powergaming, mass RP et gestion du temps.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.1<\/span><h3>AFK et présence<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#scène<\/span><span>#présence<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est interdit de rester AFK volontairement dans une scène RP pour éviter une interaction ou une conséquence.<\/p>\n          <p>Si tu dois t'absenter :<\/p>\n          <ul><li>Préviens les joueurs concernés.<\/li><li>Quitte la scène correctement si possible.<\/li><\/ul>\n          <p>Un AFK abusif peut entraîner :<\/p>\n          <ul><li>L'annulation de la scène.<\/li><li>Une sanction staff.<\/li><\/ul>\n          <p>Un AFK ne doit jamais servir à bloquer, esquiver ou casser une scène.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.2<\/span><h3>Bastion<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#bataille<\/span><span>#bastion<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le bastion est considéré comme le camp adverse : il correspond au village ou point fort du pays ennemi.<\/p>\n          <p>Chaque bastion dispose d'un drapeau. Sa capture est obligatoire avant toute revendication.<\/p>\n          <p><strong>Zones de relève en bataille :<\/strong><\/p>\n          <ul><li>Brume de Kiri, autour du bastion de Konoha et sur le pont : si tu tombes dans l'une de ces zones, tu n'es relevable par la faction adverse que si celle-ci remporte la bataille.<\/li><\/ul>\n          <p><strong>Spells INTERDITS devant les bastions :<\/strong><\/p>\n          <ul>\n            <li>Toutes les techniques de rang S et rang X.<\/li>\n            <li>Invocations (toutes tailles et tous types).<\/li>\n            <li>Susano (toutes formes, y compris MS et EMS).<\/li>\n          <\/ul>\n          <p>La récupération d'un bastion se règle uniquement :<\/p>\n          <ul><li>Par une négociation entre les deux villages concernés.<\/li><li>Par une guerre préparée.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.3<\/span><h3>Haut gradé<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#hiérarchie<\/span><\/div>\n        <div class=\"article-body\"><p>Un ninja est considéré comme haut gradé à partir du rang de Tokubetsu Jonin.<\/p><\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.4<\/span><h3>Temporalité<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#temps<\/span><\/div>\n        <div class=\"article-body\">\n          <p>1 semaine IRL = 1 an RP, 1 jour IRL = 1 mois RP.<\/p>\n          <p>En règle générale, un personnage sort de l'académie à 14 ans.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.5<\/span><h3>Bastions, pays et frontières<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#frontière<\/span><span>#RPK<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Un bastion est une zone protégée et sensible.<\/p>\n          <p>Entrer dans un pays ennemi impose un /na, exemple : « /na Un Jonin de Konoha rentre au Pays de l'Eau ». Valable de Genin à Kage.<\/p>\n          <p>Autour des bastions, les restrictions sont plus fortes.<\/p>\n          <p>Une intrusion peut exposer au RPK.<\/p>\n\n          <div class=\"sub-article\">\n            <h4>Art. 1.5.1 — Pays adverse et zone neutre<\/h4>\n            <p>Tout ninja entrant dans un pays ennemi doit obligatoirement effectuer un /na.<\/p>\n            <p>L'absence d'annonce expose à une sanction HRP.<\/p>\n            <p>Une fois dans le pays adverse, tu es sous risque RPK constant.<\/p>\n            <p>Exception : joueurs ayant obtenu une tenue ou un bandeau du village ennemi via un ticket vol.<\/p>\n          <\/div>\n\n          <div class=\"sub-article\">\n            <h4>Art. 1.5.2 — Restrictions autour des bastions<\/h4>\n            <p>Aucun ninja adverse ne se déplace librement dans un bastion, sauf invitation exceptionnelle validée.<\/p>\n            <p>Les portes marquent les limites du bastion : les franchir peut t'exposer à un RPK sans void.<\/p>\n            <p>Interdits dans / autour du bastion : jutsu, épée, taijutsu.<\/p>\n            <p>Il est interdit d'attaquer dans les frontières ou les passages, d'y faire des allers-retours, ou de passer la frontière en plein combat.<\/p>\n            <p>En combat, le seul repli autorisé est un repli vers le bastion ou le village concerné.<\/p>\n          <\/div>\n\n          <div class=\"sub-article\">\n            <h4>Art. 1.5.3 — Zone neutre<\/h4>\n            <p>Une zone neutre est un espace qui n'appartient à aucun village.<\/p>\n            <p>Elle ne suspend jamais les règles RP générales du serveur.<\/p>\n            <p>Le statut neutre ne doit pas servir à contourner une bataille ou provoquer sans conséquence.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.6<\/span><h3>Fairplay<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#fairplay<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le fairplay consiste à prendre en compte l'expérience des autres joueurs. Tout le monde doit pouvoir jouer dans de bonnes conditions.<\/p>\n          <p>Exemple de manque de fairplay :<\/p>\n          <ul><li>S'acharner sur un seul ninja alors que l'écart de nombre ou de puissance est déjà écrasant.<\/li><\/ul>\n          <p>Le staff peut sanctionner un manque de fairplay au cas par cas.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.7<\/span><h3>WinRP et loseRP<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#fairplay<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le winRP consiste à vouloir gagner à tout prix. Le loseRP consiste à accepter une défaite cohérente quand la scène le demande.<\/p>\n          <p>Tu ne dois jamais ignorer ton environnement, tes blessures ou la logique de la scène pour forcer une victoire.<\/p>\n          <p>Exemple :<\/p>\n          <ul><li>Refuser toute négociation uniquement parce que tu sais que ton personnage est plus fort en combat.<\/li><\/ul>\n          <p>Le loseRP crée souvent plus de conséquences, plus de scènes et plus de développement.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.8<\/span><h3>ForceRP<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#fairplay<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le forceRP consiste à imposer une action, un passé ou une situation à d'autres joueurs sans leur laisser de vraie réponse RP.<\/p>\n          <p>Exemples interdits :<\/p>\n          <ul>\n            <li>Inventer un passé qui force une autre faction à entrer dans ton histoire.<\/li>\n            <li>Provoquer uniquement pour forcer un combat.<\/li>\n            <li>Lancer une scène ciblée uniquement pour voler un objet obtenu juste avant, sans construction RP crédible.<\/li>\n          <\/ul>\n          <p>Tu peux proposer une scène forte. Tu ne peux pas obliger l'autre à la subir sans cadre ni logique.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.9<\/span><h3>Métagaming<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#meta<\/span><span>#HRP<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le métagaming consiste à utiliser en RP des informations obtenues hors RP.<\/p>\n          <p>Cela inclut :<\/p>\n          <ul><li>Discord.<\/li><li>Stream.<\/li><li>Réseau social.<\/li><li>Message non destiné à ton personnage.<\/li><li>Information d'interface non lisible en RP.<\/li><\/ul>\n          <p>Tu ne peux pas reconnaître une faction uniquement grâce au HUD. Il faut une preuve RP crédible, un signe visible ou un contexte clair.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.10<\/span><h3>Powergaming<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#abus<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le powergaming consiste à réaliser une action possible en jeu, mais incohérente dans l'univers Naruto.<\/p>\n          <p>Exemples :<\/p>\n          <ul><li>Rester sous l'eau anormalement longtemps sans conséquence.<\/li><li>Exploiter une mécanique du jeu pour ignorer une limite physique évidente.<\/li><\/ul>\n          <p>Le staff peut annuler l'action, relever la scène ou appliquer un RPK selon le contexte.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.11<\/span><h3>Mass RP<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#cohérence<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le mass RP consiste à prendre en compte que le monde n'est jamais vide. Même avec peu de joueurs connectés, villages, routes et institutions restent peuplés en RP.<\/p>\n          <p>Tu dois donc tenir compte :<\/p>\n          <ul><li>Des villageois.<\/li><li>Des marchands.<\/li><li>Des gardes.<\/li><li>Des ninjas non joués.<\/li><\/ul>\n          <p>Exemples :<\/p>\n          <ul><li>Lancer un jutsu en plein village sans raison valable peut toucher des civils.<\/li><li>Une prison n'est jamais libre de toute surveillance.<\/li><\/ul>\n          <p>L'usage d'un jutsu de clan, d'un subjutsu ou d'un KG unique par une force spéciale ne suffit pas, à lui seul, à prouver l'appartenance à cette entité.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 1.12<\/span><h3>Cohérence RP<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#cohérence<\/span><\/div>\n        <div class=\"article-body\">\n          <p>La cohérence RP consiste à respecter l'univers, le contexte et la logique de ton personnage.<\/p>\n          <p>Tu dois notamment :<\/p>\n          <ul><li>Garder un vocabulaire adapté à l'univers.<\/li><li>Respecter la hiérarchie en jeu.<\/li><li>Éviter les changements d'apparence sans raison valable.<\/li><li>Éviter les jutsu dans des contextes absurdes.<\/li><\/ul>\n          <p>Une action techniquement possible, mais incohérente avec la scène ou l'univers, peut être sanctionnée.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-2\">\n      <h2>02. Équipement &amp; identification <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Identification, artefacts, armes uniques, masques et règles de tenue.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.1<\/span><h3>Armes uniques et items uniques<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#arme<\/span><span>#artefact<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est strictement interdit de dissimuler une arme unique pour éviter d'être identifié. Toute arme en ta possession doit rester visible en permanence.<\/p>\n          <p>Une arme unique est considérée comme un artefact dès qu'elle bénéficie d'une renommée reconnue en jeu. Les Épées de la Brume obtiennent automatiquement ce statut.<\/p>\n          <p>Pour les créations personnelles, il revient aux joueurs de construire leur légende.<\/p>\n          <p>Une arme peut évoluer en RP, gagner en réputation et prendre une place plus importante, mais cette évolution ne modifie jamais automatiquement ses statistiques, ses effets ou ses avantages HRP.<\/p>\n          <p>Une seule demande de négociation d'artefact est autorisée par village et par jour (parchemins, épées notamment).<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.2<\/span><h3>Artefacts tranchants<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#arme<\/span><span>#kenjutsu<\/span><\/div>\n        <div class=\"article-body\"><p>Tous les artefacts tranchants possédant une lame doivent utiliser le style de combat Kenjutsu.<\/p><\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.3<\/span><h3>Masques<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#identité<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Une personne portant un masque est considérée comme impossible à reconnaître. Cela vaut aussi pour : masque simple, masque fissuré, respirateur.<\/p>\n          <p>Exceptions :<\/p>\n          <ul>\n            <li>Si la personne détient une arme unique.<\/li>\n            <li>Si elle donne son nom alors qu'elle est masquée.<\/li>\n            <li>Si la personne porte un artefact de clan, tu peux reconnaître le clan, et uniquement le clan (ex. jarre Sabaku, tenue de clan).<\/li>\n          <\/ul>\n          <p>Voir le même masque et la même tenue plusieurs heures plus tard ne permet pas de récupérer une identité.<\/p>\n          <p>Un style de combat, une technique signature ou un jutsu caractéristique ne suffit pas, à lui seul, à identifier formellement un joueur.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.4<\/span><h3>Familiers et objets boutique<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#identité<\/span><\/div>\n        <div class=\"article-body\"><p>Tu ne peux pas reconnaître un ninja à son familier ou à ses tenues boutique. Ces éléments ne sont pas uniques.<\/p><\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.5<\/span><h3>Tenues en contexte de combat<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#tenue<\/span><span>#combat<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est strictement interdit aux hauts gradés de porter une tenue réservée à un grade inférieur en contexte de combat.<\/p>\n          <p>Cela vaut pour :<\/p>\n          <ul><li>Bataille imminente.<\/li><li>Guerre.<\/li><li>Affrontement PvP.<\/li><li>Capture de ninja.<\/li><li>Prise ou défense de drapeau.<\/li><li>Toute situation liée à un conflit direct.<\/li><\/ul>\n          <p>Exemples interdits :<\/p>\n          <ul><li>Un Tokubetsu Jonin en survêtement de Genin.<\/li><li>Un Jonin avec une tenue de Tokubetsu Jonin.<\/li><\/ul>\n          <p>Hors combat, une liberté de tenue existe tant qu'elle ne crée pas de confusion. Le non-respect entraîne des sanctions immédiates.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 2.6<\/span><h3>Tenues<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#tenue<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les nukenin ne sont pas autorisés à donner ou vendre des tenues appartenant à un village.<\/p>\n          <p>Tu ne peux pas porter une tenue supérieure à ton grade.<\/p>\n          <p>Il est strictement interdit de vendre des tenues liées à une appartenance RP spécifique, y compris via l'HDV.<\/p>\n          <p>Il est également interdit d'acheter une tenue d'un village ennemi via PNJ ou joueur.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n    <section id=\"rp-3\">\n      <h2>03. Captures &amp; scènes sensibles <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Capturer, transporter, voler ou lancer une scène de RPK demande un cadre strict.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.1<\/span><h3>Assommer<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#capture<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le fait d'assommer, de capturer ou d'emprisonner un shinobi doit toujours se faire dans le respect du RP et de manière logique.<\/p>\n          <p>Règles générales :<\/p>\n          <ul>\n            <li>Un shinobi peut être assommé uniquement avec une raison RP valable.<\/li>\n            <li>La capture doit être accompagnée d'un RP clair et logique.<\/li>\n            <li>Le joueur capturé doit avoir une possibilité de réagir.<\/li>\n            <li>Une porte de sortie RP doit toujours exister.<\/li>\n            <li>L'emprisonnement doit reposer sur une raison valable.<\/li>\n          <\/ul>\n          <p>Tout abus, no RP ou powergaming peut entraîner des sanctions.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.2<\/span><h3>Captures hors batailles<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#capture<\/span><span>#grade<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Pour des raisons de fairplay, lors d'une capture de ninja dans le cadre d'un ticket RPK : il est interdit de déployer plus de 3 personnes d'un rang égal ou supérieur à celui de la cible. Cette règle ne s'applique pas aux Jonin et supérieurs.<\/p>\n          <p>Un Genin ne peut pas être capturé dans ce cadre.<\/p>\n          <p>Les captures se divisent en deux groupes :<\/p>\n          <ul><li>Groupe 1 : de Chunin à Tokubetsu Jonin.<\/li><li>Groupe 2 : de Jonin à Sannin.<\/li><\/ul>\n          <table class=\"rules-table\">\n            <tr><th>Grade du joueur<\/th><th>Peut capturer<\/th><\/tr>\n            <tr><td>Genin<\/td><td>Personne dans ce cadre<\/td><\/tr>\n            <tr><td>Chunin<\/td><td>Chunin → Tokubetsu Jonin<\/td><\/tr>\n            <tr><td>Tokubetsu Jonin<\/td><td>Chunin → Tokubetsu Jonin<\/td><\/tr>\n            <tr><td>Jonin<\/td><td>Jonin → Sannin<\/td><\/tr>\n            <tr><td>Sannin<\/td><td>Jonin → Sannin<\/td><\/tr>\n          <\/table>\n          <p>Conditions de capture :<\/p>\n          <ul>\n            <li>Un ninja doit obligatoirement être mis en pain.<\/li>\n            <li>Menacer une cible à la lame sous la gorge en plein combat est interdit.<\/li>\n            <li>Cette action n'est autorisée qu'après le combat, sur une cible déjà en pain.<\/li>\n          <\/ul>\n          <p>Il est interdit de capturer un ninja alors qu'un des tiens est déjà capturé dans le but d'en faire un levier diplomatique.<\/p>\n          <p>Si un joueur se rend, est capturé pendant un combat et amené au bastion ou au village, aucune reprise de combat n'est autorisée après cela.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.3<\/span><h3>Transport d'un prisonnier<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#capture<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Si tu portes un ninja sur ton dos et que tu es menacé ou attaqué par des jutsu, tu es obligé de le déposer.<\/p>\n          <p>Une prise d'otage reste possible. Tu ne peux pas fuir librement avec le prisonnier sur le dos si l'opposition peut te rattraper.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.4<\/span><h3>Cas de chute après dépôt<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#capture<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Si tu déposes un ninja au sol, qu'il tente de fuir puis tombe, tu as plein droit de vie ou de mort sur lui.<\/p>\n          <p>Si tu tombes après l'avoir déposé et que le ninja tombe aussi sans avoir tenté de fuir, il ne peut pas être soumis à un RPK ni être relevé.<\/p>\n          <p>Seule exception : abus volontaire de sa propre faction pour détourner la règle.<\/p>\n          <p>Sommation pendant le transport : si tu portes un ninja sur ton dos et que tu te retrouves encerclé par 2 ninjas ou plus d'un rang équivalent au tien, tu es dans l'obligation de déposer le prisonnier dès la sommation. Continuer à fuir dans ces conditions n'est pas autorisé.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.5<\/span><h3>Capture sous Jonin<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#grade<\/span><\/div>\n        <div class=\"article-body\"><p>La capture en dessous du rang de Jonin est interdite hors cadre spécifique validé.<\/p><\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.6<\/span><h3>Arnaques et racket<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#économie<\/span><\/div>\n        <div class=\"article-body\">\n          <p>L'arnaque concernant un équipement ou tout autre objet est strictement interdite.<\/p>\n          <p>En cas de prêt, même si ton personnage meurt, tu restes tenu de rembourser ta dette.<\/p>\n          <p>Le racket est limité à 5 000 ryos par scène. L'usage de ton influence pour dépasser ce plafond est interdit.<\/p>\n          <p>Le plafond de 5 000 ryos vaut pour l'ensemble de la scène, quel que soit le nombre de participants.<\/p>\n          <p>Exemples :<\/p>\n          <ul><li>1 joueur sur la scène = jusqu'à 5 000 ryos au total.<\/li><li>8 joueurs sur la scène = toujours 5 000 ryos au total si le montant est réparti.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.7<\/span><h3>Pain<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#pain<\/span><span>#fear<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Être en pain signifie que tes HP sont trop bas pour bouger. Tu ne peux agir que si tu es porté par un autre joueur.<\/p>\n          <p>Quand tu es en pain :<\/p>\n          <ul><li>Tu dois jouer ton fear.<\/li><li>Ce fear s'adapte à ton grade.<\/li><li>Il doit rester proportionnel au grade de l'adversaire et au contexte.<\/li><\/ul>\n          <p>Si tu es médecin et que tu te régénères pendant que quelqu'un te porte, sans ligotage ni désactivation de ta radio, tu peux : te dégager, utiliser ta radio discrètement.<\/p>\n          <p>Le painRP consiste aussi à jouer la douleur, la fatigue et les conséquences physiques de la scène. Même si le jeu régénère vite, ton personnage ne redevient pas intact instantanément.<\/p>\n          <p>Après un combat lourd, tu dois jouer :<\/p>\n          <ul><li>La douleur.<\/li><li>L'essoufflement.<\/li><li>La gêne dans les déplacements.<\/li><li>Le besoin d'aide ou de soins.<\/li><\/ul>\n\n          <div class=\"sub-article\">\n            <h4>Art. 3.7.1 — Fear RP<\/h4>\n            <p>Le fearRP consiste à jouer la peur que ressent ton personnage. Même un personnage courageux doit jouer sa peur dans certaines situations.<\/p>\n            <p>Exemples :<\/p>\n            <ul><li>Être encerclé.<\/li><li>Être très inférieur en nombre.<\/li><li>Faire face à plus fort que soi en territoire ennemi.<\/li><li>Se retrouver face à des professeurs, à la police ou à de hauts gradés quand le contexte impose la retenue.<\/li><\/ul>\n            <p>Un manque grave de fearRP peut exposer ton personnage à de lourdes conséquences, y compris un RPK selon la scène.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.8<\/span><h3>RP prison<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#prison<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Un joueur en prison sans interaction pendant 30 minutes peut être libéré rapidement par un haut gradé.<\/p>\n          <p>Par principe, un joueur capturé ne doit pas rester entre 30 et 60 minutes sans interaction RP, sans suivi clair ou sans justification valable.<\/p>\n          <p>Une preuve doit être fournie au staff. Le staff contactera les hauts gradés concernés.<\/p>\n          <p>Exceptions :<\/p>\n          <ul><li>Attente de jugement pour trahison.<\/li><li>Diplomatie ou affaire en cours.<\/li><\/ul>\n          <p>Le même délai s'applique aussi aux membres de la police. Les prisons sont surveillées passivement via le mass RP.<\/p>\n          <p>Même lors d'une intervention pour permettre une sortie ou une libération rapide, cette libération doit être jouée en RP.<\/p>\n          <p>Il est strictement interdit de fuir d'une cellule de Police, de Palais ou d'ANBU.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.9<\/span><h3>RPK<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#RPK<\/span><span>#staff<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Lors de l'initiation d'une scène de RPK :<\/p>\n          <ul><li>Tu dois obligatoirement @ un staff en jeu.<\/li><li>Tu dois t'assurer qu'un staff est disponible pour spectate.<\/li><\/ul>\n          <p>Cette exigence vaut aussi pour les Keto et les autres scènes à trame. Ces scènes doivent obligatoirement être réalisées sous surveillance staff.<\/p>\n          <p>À défaut, la scène peut être void si tu ne peux pas fournir un enregistrement complet ou une preuve d'avoir tenté de contacter les admins.<\/p>\n          <p><strong>Restrictions par grade :<\/strong><\/p>\n          <ul><li>Les tickets RPK sont autorisés uniquement à partir du grade de Tokubetsu Jonin.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.10<\/span><h3>Vols d'armes uniques et de dojutsu<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#vol<\/span><span>#ticket<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Pour voler une arme unique ou un dojutsu, un ticket est obligatoire. Tu dois :<\/p>\n          <ul><li>Expliquer les raisons en détail.<\/li><li>Fournir des preuves si possible.<\/li><li>Capturer le ninja concerné.<\/li><\/ul>\n          <p><strong>Règles spécifiques aux dojutsu :<\/strong><\/p>\n          <ul><li>Tu ne peux voler les pupilles qu'au détenteur originel.<\/li><li>Si le détenteur originel les a perdues, il peut les récupérer et se les réimplanter sans ticket vol.<\/li><\/ul>\n          <p>Lors d'une scène de vol, tu es automatiquement sous risque RPK par la cible et les témoins.<\/p>\n          <p>Pour un vol de pupilles :<\/p>\n          <ul><li>Un /roll est requis pour chaque œil.<\/li><li>L'état des pupilles doit être vérifié.<\/li><li>Les pupilles se volent par paire.<\/li><\/ul>\n          <p>Activation du ticket :<\/p>\n          <ul><li>Préviens le staff avec : @ ticket vol / RPK activé.<\/li><li>Attends 5 minutes avant de commencer la scène.<\/li><\/ul>\n          <p>Conséquences pour la victime :<\/p>\n          <ul><li>Si un personnage est tué et que ses pupilles sont volées, il ne peut pas relancer de nouvelle naissance tant que le voleur les détient.<\/li><\/ul>\n          <p>Réimplantation :<\/p>\n          <ul><li>Un membre de clan peut réimplanter ses pupilles volées une seule fois.<\/li><li>Après réimplantation, elles ne sont plus utilisables pour de futurs vols.<\/li><\/ul>\n          <p>Interdit de faire un ticket vol contre une personne que tu détiens déjà dans tes cellules. Tant qu'elle est emprisonnée, aucun ticket vol ne peut être lancé à son encontre.<\/p>\n          <p>Immunité d'arme :<\/p>\n          <ul><li>Pendant les 5 jours qui suivent le moment où un joueur prend une arme, il est tout simplement interdit de la lui voler.<\/li><li>Seul l'ancien porteur fait exception : il peut récupérer son arme volée pendant ces 5 jours. Passé ce délai, s'il veut la reprendre, il doit faire un ticket vol.<\/li><\/ul>\n          <p>Restriction : une simple dispute personnelle n'est pas une raison valable. Si l'identité du responsable n'est pas certaine, le ticket vol peut être refusé.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 3.11<\/span><h3>Vol par le bluff (pays neutre)<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#vol<\/span><span>#bluff<\/span><span>#neutre<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Un joueur d'un grade strictement supérieur à Tokubetsu Jonin peut se faire voler son arme et les parchemins qu'il possède sans ticket vol, à condition d'avoir été capturé en pays neutre.<\/p>\n          <p>Ce vol se joue uniquement par le bluff : tu obtiens les objets en convainquant la cible de les remettre, par exemple via la pression RP ou l'intimidation.<\/p>\n          <p>Conditions et limites :<\/p>\n          <ul>\n            <li>Cible : grade strictement au-dessus de Tokubetsu Jonin (Jonin et plus).<\/li>\n            <li>Lieu : la capture doit avoir eu lieu en pays neutre.<\/li>\n            <li>Aucun ticket vol n'est requis dans ce cas précis.<\/li>\n            <li>Des menaces peuvent être émises pour appuyer le bluff.<\/li>\n            <li>Il est interdit de forcer la cible à déposer ses objets : la remise doit rester volontaire en RP.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-4\">\n      <h2>04. Batailles &amp; guerres <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Repli, guerres et combats de masse obéissent à des timings précis.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.1<\/span><h3>Repli<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#bataille<\/span><span>#repli<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le premier repli sonné lors d'une bataille marque la défaite du pays qui le subit.<\/p>\n          <p>Le pays perdant dispose de 3 minutes pour regagner ses frontières ou ses bastions.<\/p>\n          <p>Un repli est validé après 3 minutes sans te faire toucher, sauf si un /repli est annoncé, auquel cas il prend effet immédiatement.<\/p>\n          <p>Si un joueur attaque après un repli et tombe : la faction ennemie a plein droit sur sa capture, corps au sol ou capture menant à un RPK.<\/p>\n          <p>Après 3 batailles contre un même pays, le pays attaqué peut déclencher une guerre.<\/p>\n          <p>Pour capturer quelqu'un avant le repli : le mettre en pain et le transporter sur son dos.<\/p>\n          <p>La participation des rangs S doit être équitable. Un rang S peut intervenir sans opposition directe uniquement si son bastion est attaqué ou qu'une attaque se déroule à proximité.<\/p>\n          <p>Après chaque repli annoncé par au moins un haut gradé, aucune bataille ne peut avoir lieu pendant 1 heure.<\/p>\n          <p>Joueurs ne respectant pas le repli, continuant à se battre ou ne revenant pas dans les 5 minutes : RPK et relevé possibles.<\/p>\n          <p>Tu es considéré en repli dès que tu rentres :<\/p>\n          <ul><li>Au pays de la Pluie pour Ame.<\/li><li>Au pays du Feu pour Konoha.<\/li><\/ul>\n          <p>Tu ne peux pas utiliser un passage de frontière comme échappatoire en plein combat. Après un repli, tu dois attendre 15 minutes avant de reprendre part à un combat.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.2<\/span><h3>Batailles préméditées<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#bataille<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Avant toute bataille entre deux villages, un échange entre hauts gradés doit avoir lieu.<\/p>\n          <p>Les diplomates peuvent mener certaines discussions sans devoir demander la permission pour la diplomatie courante. L'initiative finale revient aux hauts gradés concernés.<\/p>\n          <p>Ce dialogue permet de déterminer :<\/p>\n          <ul><li>Les captures.<\/li><li>Les conditions négociées.<\/li><li>Les limitations issues de la diplomatie ou d'un traité.<\/li><\/ul>\n          <p>Par défaut : nombre de captures illimité, grade minimum visé libre.<\/p>\n          <p>Tout haut gradé souhaitant participer à partir de Commandant Militaire Jonin (CMJ) doit faire un /na avant d'entrer sur le champ de bataille. Le chakra imposant doit être perceptible, sans obligation d'écrire le nom dans le /na.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.3<\/span><h3>Fairplay en bataille<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#fairplay<\/span><span>#bataille<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les joueurs de rang Jonin, Commandant Militaire Jonin (CMJ) et Kage peuvent entrer en bataille sans exigence d'équilibrage strict par grade.<\/p>\n          <p>À partir du rang Commandant Militaire Jonin (CMJ) : l'entrée doit être signalée au moins 3 minutes à l'avance via /na.<\/p>\n          <p>En cas de non-signalement, le joueur s'expose à une sanction RP, avec relevé possible et exposition au RPK.<\/p>\n          <p>Exception : cette règle ne s'applique pas aux batailles devant les bastions, toute l'armée peut entrer en combat sans prévenir.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.4.1<\/span><h3>Déclenchement d'une guerre<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#guerre<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Une guerre peut être déclenchée :<\/p>\n          <ul><li>Après 3 batailles contre le même pays.<\/li><li>Ou pour un motif majeur.<\/li><\/ul>\n          <p>Les deux Kage doivent être présents pour définir un effectif équitable.<\/p>\n          <p>La retraite marque la défaite du pays concerné. Une guerre entraîne toujours des conséquences pour le pays perdant.<\/p>\n          <p>Le Kage vainqueur peut imposer des conditions si elles restent raisonnables et fairplay.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.4.2<\/span><h3>Participation et hiérarchie<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#guerre<\/span><\/div>\n        <div class=\"article-body\">\n          <ul>\n            <li>La participation des rangs S doit être équilibrée.<\/li>\n            <li>Un rang S ne peut intervenir que si son bastion ou son pays est attaqué.<\/li>\n            <li>Les bas gradés participent immédiatement.<\/li>\n            <li>Les hauts gradés attendent 5 minutes après le début du combat des bas gradés.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.4.3<\/span><h3>Application de la NLR<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#NLR<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Aucun NLR n'est autorisé dans une même bataille.<\/p>\n          <p>Si ton personnage est blessé : tu dois jouer son pain RP et aller te faire soigner avant de revenir.<\/p>\n          <p>Si une nouvelle bataille éclate dans un autre secteur, tu peux y participer.<\/p>\n          <p>Après être tombé au combat, tu dois attendre 45 minutes avant de reprendre part à un nouveau combat dans le même secteur.<\/p>\n          <p>Tout non-respect de la NLR peut entraîner un bannissement d'une semaine.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.4.4<\/span><h3>Restrictions et frontières<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#frontière<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Aucun sort, même de soin ou de temporisation, n'est autorisé à la frontière ou au-delà dans le cadre où cette règle s'applique.<\/p>\n          <p>Tu dois laisser sortir toute faction souhaitant se retirer.<\/p>\n          <p>En cas de retraite, tu dois franchir la frontière après la ligne rouge et ne pas revenir. Tout retour est considéré comme une violation de la NLR.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.4.5<\/span><h3>Conséquences de guerre<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#guerre<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le pays vainqueur peut imposer des conditions spécifiques au pays vaincu. Elles doivent rester :<\/p>\n          <ul><li>Fairplay.<\/li><li>Raisonnables.<\/li><li>Cohérentes en RP.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.5<\/span><h3>Relever un ninja<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#capture<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Si un no fear ou un repli n'est pas respecté, ou si un ninja est mis au sol par sa propre faction alors qu'il est déjà en pain, il peut être relevé et capturé.<\/p>\n          <p>Cette règle vaut uniquement si sa faction est perdante pendant la bataille ou le combat.<\/p>\n          <p>En cas de usebug avéré et prouvé, le ninja doit être relâché immédiatement.<\/p>\n          <p>Le joueur relevé doit jouer son état de pain correctement.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 4.6<\/span><h3>Repli nukenin<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#nukenin<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les nukenin disposent d'une zone de repli considérée comme un bastion. Dans cette zone :<\/p>\n          <ul><li>Ils ne peuvent pas être capturés.<\/li><li>Ils ne peuvent pas être RPK.<\/li><\/ul>\n          <p>Les règles de bastion de faction s'y appliquent aussi.<\/p>\n          <p>Une fois repliés, ils doivent attendre au moins 20 minutes avant de repartir au combat.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n    <section id=\"rp-5\">\n      <h2>05. Commandes &amp; outils RP <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Utilise chaque commande pour le bon usage. Un mauvais usage du /na reste sanctionnable.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 5.1<\/span><h3>Commandes chat<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#commande<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Usage général :<\/p>\n          <ul>\n            <li>/me décrit une action.<\/li>\n            <li>/it décrit l'environnement ou un état.<\/li>\n            <li>/na sert à une narration visible par tous.<\/li>\n            <li>/hrp sert au hors-RP.<\/li>\n            <li>@ permet de contacter rapidement un staff.<\/li>\n          <\/ul>\n          <p>Tout /na déplacé ou non pertinent peut être sanctionné.<\/p>\n          <p>Le /na doit être utilisé uniquement pour : faire progresser un personnage, exprimer des émotions. Il ne doit jamais transmettre une pensée interne.<\/p>\n          <p>Les informations d'un /na ne doivent jamais être prises en compte comme une information RP brute. Pour décrire une situation RP locale, utilise plutôt /it.<\/p>\n          <p>Un /na provocateur annonçant l'entrée dans un pays fief peut exposer le joueur au relevé et au RPK s'il tombe.<\/p>\n          <p>Toute information obtenue sur Discord, en vocal externe ou par tout autre moyen HRP ne peut jamais être utilisée directement en RP.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 5.2<\/span><h3>Missives in-RP<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#missive<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est impératif de privilégier les missives in-RP pour toute conversation entre personnages.<\/p>\n          <p>Discord doit être utilisé uniquement en dernier recours pour :<\/p>\n          <ul><li>Organiser un rendez-vous.<\/li><li>Discuter hors RP.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 5.3<\/span><h3>/roll<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#roll<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le /roll sert à trancher certaines situations contestables ou sensibles. Il ne remplace pas le RP.<\/p>\n          <p>Il intervient seulement quand le cadre l'exige ou quand un staff le demande.<\/p>\n          <p>Un /roll peut notamment être requis pour :<\/p>\n          <ul>\n            <li>Certaines captures encadrées.<\/li>\n            <li>Un duel ou une opposition serrée.<\/li>\n            <li>Un vol de pupilles.<\/li>\n            <li>Un affrontement ou défi entre Jonin et Sannin si le cadre staff l'impose.<\/li>\n          <\/ul>\n          <p>Si un /roll est demandé dans une scène encadrée, son refus peut entraîner l'annulation de l'action ou une intervention du staff.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-6\">\n      <h2>06. Techniques sensibles <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Genjutsu, fuinjutsu, pupilles et dojutsu demandent du fairplay et un suivi strict.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.1.1<\/span><h3>Reconnaissance des pupilles<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#dojutsu<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est impossible de reconnaître une pupille via une technique utilisée si l'utilisateur porte un masque.<\/p>\n          <p>En règle générale, tu ne gardes pas de souvenir exploitable d'un genjutsu subi, sauf suivi RP spécifique.<\/p>\n          <p>Cette règle est encore plus stricte si l'utilisateur est plus avancé que toi en genjutsu ou dojutsu.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.1.2<\/span><h3>Observation extérieure<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#dojutsu<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les observateurs présents peuvent comprendre qu'un genjutsu a été appliqué. Ils peuvent signaler sa présence.<\/p>\n          <p>Ils ne peuvent pas identifier le clan uniquement à partir de cela.<\/p>\n          <p>Sans information externe crédible, tu ne conserves pas de souvenir utilisable du genjutsu.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.1.3<\/span><h3>Vol et transfert de pupilles<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#dojutsu<\/span><span>#ticket<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Tout vol, transfert ou modification de pupilles doit faire l'objet :<\/p>\n          <ul><li>D'un ticket officiel.<\/li><li>D'un suivi RP.<\/li><\/ul>\n          <p>Ce suivi doit préciser :<\/p>\n          <ul><li>La compétence nécessaire.<\/li><li>La validité du vol ou transfert.<\/li><\/ul>\n          <p>Aucun vol ni implantation ne devient effectif sans ticket validé.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.2<\/span><h3>Genjutsu<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#genjutsu<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le genjutsu est une mécanique puissante. Il doit toujours être joué avec fairplay.<\/p>\n          <p>Quand tu subis un genjutsu offensif, tu ne conserves que le souvenir de ce que la scène te permet légitimement de retenir.<\/p>\n          <p>Si deux personnages de niveau égal se lancent un genjutsu mutuellement, un /roll peut être requis.<\/p>\n          <p>Tu n'entends pas en RP le bruit d'activation des dojutsu. Tu ne peux pas obtenir d'information RP automatique sur leur activation ou désactivation.<\/p>\n          <p>Tout usage du genjutsu à des fins de winRP peut entraîner un RPK immédiat, sans BDA.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.3<\/span><h3>Fuinjutsu<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#fuinjutsu<\/span><\/div>\n        <div class=\"article-body\">\n          <p>L'utilisation du fuinjutsu doit respecter le fairplay.<\/p>\n          <p>Les sceaux de section secrète requièrent un accord HRP préalable.<\/p>\n          <p>Un usage abusif du fuinjutsu à des fins de winRP, notamment répété deux fois, peut mener au RPK.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 6.4<\/span><h3>Transformations majeures<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#transformation<\/span><span>#bataille<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Afin de préserver l'équilibre des combats et d'éviter les abus liés aux transformations les plus puissantes, certaines formes disposent d'un nombre limité d'utilisations par bataille.<\/p>\n          <p>Répartition actuelle :<\/p>\n          <table class=\"rules-table\">\n            <tr><th>Transformation<\/th><th>Utilisations par bataille<\/th><\/tr>\n            <tr><td>Susano MS<\/td><td>2<\/td><\/tr>\n            <tr><td>Démon Poisson<\/td><td>2<\/td><\/tr>\n            <tr><td>Susano EMS<\/td><td>∞ (illimité)<\/td><\/tr>\n          <\/table>\n          <p>Cette limitation permet de garder une cohérence RP tout en évitant les enchaînements excessifs de transformations durant un même affrontement.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-7\">\n      <h2>07. Politique &amp; allégeance <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Tout changement d'allégeance, coup d'état, traité ou mission d'espionnage doit rester documenté et crédible.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.1<\/span><h3>RP traître et désertion<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#trahison<\/span><span>#ticket<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Pour envisager une trahison ou une désertion, tu dois ouvrir un ticket.<\/p>\n          <p>Pour déserter, tu dois être au minimum Tokubetsu Jonin. En dessous de ce grade, une désertion ne peut pas être acceptée sauf exception majeure validée par le staff.<\/p>\n          <p>Toute demande doit reposer sur un motif RP crédible, clair et cohérent. Tu dois expliquer tes raisons en détail et fournir des preuves si possible.<\/p>\n          <p>Tout ticket traître ou toute désertion t'expose à un RPK par la faction ou la personne trahie.<\/p>\n          <p>La validation HRP d'une désertion ne garantit pas l'acceptation par le village ennemi, ni la protection contre un RPK ou une vengeance RP légitime.<\/p>\n          <p>Un déserteur reste sous risque RPK constant. Un ninja ayant déserté n'est pas automatiquement considéré comme nukenin.<\/p>\n\n          <div class=\"sub-article\">\n            <h4>Art. 7.1.1 — Capture d'un déserteur<\/h4>\n            <p>Les règles habituelles de capture et de fairplay sur le nombre de personnes impliquées ne s'appliquent plus de la même manière.<\/p>\n            <p>La cohérence RP reste obligatoire :<\/p>\n            <ul><li>Kage et rangs S ne doivent pas s'acharner sur des déserteurs sous Jonin.<\/li><li>La traque doit être confiée à des grades similaires.<\/li><\/ul>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.2<\/span><h3>Coup d'état<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#rébellion<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Pour préparer un coup d'état, tu dois impérativement ouvrir un ticket rébellion.<\/p>\n          <p>En cas de rébellion sans ticket, les participants s'exposent à un wipe total sans révocation.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.3<\/span><h3>Retraite de l'armée<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#armée<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Un ninja ne peut pas quitter l'armée tout en restant simplement dans son village.<\/p>\n          <p>Une désertion n'est autorisée qu'à partir du rang de Tokubetsu Jonin.<\/p>\n          <p>Exception : les Sannin.<\/p>\n          <p>Pour quitter l'armée, deux options :<\/p>\n          <ul><li>Ticket de désertion.<\/li><li>Départ avec accord du Kage.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.4<\/span><h3>Passage Sannin<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#grade<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Quand un personnage passe Sannin :<\/p>\n          <ul>\n            <li>Il n'est plus considéré comme un ninja actif ordinaire.<\/li>\n            <li>Il ne participe plus normalement aux guerres et batailles.<\/li>\n            <li>Il devient un personnage animateur et légendaire.<\/li>\n            <li>Il a pour rôle de vivre pour lui-même, d'explorer le monde et de proposer des scènes.<\/li>\n          <\/ul>\n          <p>Des exceptions très rares peuvent exister, avec malus. Le passage au rang de Sannin doit être déclaré dans le suivi de clan.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.5<\/span><h3>Diplomatie et signature de traités<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#diplomatie<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Toute action diplomatique ou signature de traité doit rester cohérente et respectueuse du RP.<\/p>\n          <p>Principes généraux :<\/p>\n          <ul>\n            <li>Justification RP obligatoire.<\/li>\n            <li>Pas d'influence HRP.<\/li>\n            <li>Négociations officielles menées par Kage, conseil ou diplomates désignés.<\/li>\n            <li>Accords documentés via /na ou canal officiel.<\/li>\n          <\/ul>\n          <p>Les négociations doivent être : claires, équitables, réalistes.<\/p>\n          <p>Les traités doivent préciser :<\/p>\n          <ul><li>La nature de l'alliance ou du conflit.<\/li><li>Les conditions et restrictions.<\/li><li>La durée de validité.<\/li><\/ul>\n          <p>Il est interdit de se battre pendant une diplomatie, ainsi que juste après celle-ci, sauf cas exceptionnel validé par le staff ou prévu par les termes de l'échange. Une diplomatie ne doit jamais servir de prétexte pour engager un combat.<\/p>\n          <p>Une fois signé, un traité doit être respecté. Le staff peut intervenir pour arbitrer un conflit ou invalider un traité abusif.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 7.6<\/span><h3>Espionnage et collecte d'informations<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#espionnage<\/span><\/div>\n        <div class=\"article-body\">\n          <p>L'espionnage consiste à infiltrer, observer ou collecter des informations dans un cadre RP crédible.<\/p>\n          <p>Principes généraux :<\/p>\n          <ul>\n            <li>Espionnage RP uniquement.<\/li>\n            <li>Interdiction d'utiliser des informations HRP.<\/li>\n            <li>Certaines actions peuvent demander validation.<\/li>\n            <li>Certaines zones restent verrouillées par le mass RP.<\/li>\n          <\/ul>\n          <p>Méthodes autorisées :<\/p>\n          <ul><li>Infiltration physique.<\/li><li>Observation et filature.<\/li><li>Techniques spécialisées jouées avec fairplay.<\/li><\/ul>\n          <p>Limitations :<\/p>\n          <ul>\n            <li>Pas de vol ou de RPK hors scénario validé.<\/li>\n            <li>Pas de meta.<\/li>\n            <li>Pas de fuite d'informations forcée sans raison crédible.<\/li>\n            <li>Pas d'entrée dans une zone verrouillée par un mass RP.<\/li>\n          <\/ul>\n          <p>Les plaintes liées à une mission d'espionnage doivent être faites après la scène.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-8\">\n      <h2>08. Progression RP <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">La progression dépend de tes missions, de ton implication et de ton suivi RP, pas seulement du temps joué.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.1<\/span><h3>Évolution RP, missions obligatoires<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#progression<\/span><\/div>\n        <div class=\"article-body\">\n          <p>La progression RP ne dépend pas uniquement du temps de jeu ou de l'ancienneté.<\/p>\n          <p>Chaque montée de grade demande :<\/p>\n          <ul><li>Des missions validées.<\/li><li>Des activités RP.<\/li><li>Des tests ou examens.<\/li><li>Parfois des tournois officiels.<\/li><\/ul>\n          <p>Le suivi RP doit documenter : missions accomplies, participation aux sections, résultats d'examens et de tournois, scènes RP significatives.<\/p>\n          <p>L'inactivité ou le non-respect du suivi peut entraîner :<\/p>\n          <ul><li>Blocage de progression.<\/li><li>Rétrogradation.<\/li><li>Unrank RP.<\/li><li>Perte de droits liés au grade.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.2<\/span><h3>Sections obligatoires<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#section<\/span><\/div>\n        <div class=\"article-body\">\n          <p>À partir d'un certain grade RP (Chunin ou équivalent), rejoindre une section officielle devient obligatoire.<\/p>\n          <p>Exemples :<\/p>\n          <ul><li>Section militaire.<\/li><li>Section médicale.<\/li><li>Section académique.<\/li><li>Section diplomatique.<\/li><li>Toute autre section officielle.<\/li><\/ul>\n          <p>Un shinobi refusant de rejoindre une section ou restant sans section ne peut pas être promu. Il peut aussi être bloqué, rétrogradé, unrank ou perdre son statut.<\/p>\n          <p>Chaque membre doit participer activement à sa section. Rejoindre une section uniquement pour le grade sans y participer est interdit.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 8.3<\/span><h3>Familles hors clan<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#famille<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Pour créer une famille de 4 membres, il faut soumettre un projet via ticket.<\/p>\n          <p>Par la suite, la famille peut évoluer en RP vers un statut plus majeur.<\/p>\n          <p>Le passage de 4 à 6 membres demande la validation du Kage du village.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-9\">\n      <h2>09. Infiltration &amp; règles diverses <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Dernier bloc : infiltration, drapeaux, abus de pouvoir, no fear et règles diverses de terrain.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.1<\/span><h3>Infiltration<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#infiltration<\/span><span>#ban<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est strictement interdit d'utiliser la tenue d'un autre village pour s'infiltrer.<\/p>\n          <p>Exception : uniquement avec un ticket vol validé, pour une mission spécifique.<\/p>\n          <p>Une fois la mission terminée, la tenue doit être détruite immédiatement.<\/p>\n          <p>Tout manquement à cette règle peut entraîner un bannissement.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.2<\/span><h3>Capture de drapeaux<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#drapeau<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Après une capture de drapeau, réussie ou non, il est interdit d'en tenter une autre avant 1 heure.<\/p>\n          <p>Si une défense de drapeau réussit, le drapeau ne peut pas être attaqué pendant 2 heures. La défense doit être annoncée via /na avec l'heure.<\/p>\n          <p>Intervention tierce interdite : tout joueur extérieur à la capture ne peut pas intervenir.<\/p>\n          <p>Les captures se jouent en 5 contre 5 : 5 joueurs maximum, 3 joueurs minimum.<\/p>\n          <p>Un /na doit annoncer : le lieu du combat, l'intention de capturer le drapeau.<\/p>\n          <p>Les escouades doivent se former devant le pays ciblé. Une présentation diplomatique est obligatoire avant de commencer.<\/p>\n          <p>Les captures de drapeau ne sont pas faisables pour les grades au-dessus de Tokubetsu Jonin.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.3<\/span><h3>Copinage<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#staff<\/span><span>#abus<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Il est strictement interdit d'utiliser ses relations HRP ou son rang pour favoriser l'avancement d'un joueur.<\/p>\n          <p>Cela vaut pour :<\/p>\n          <ul><li>Suivi.<\/li><li>Promotion.<\/li><li>Progression.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.4<\/span><h3>NoFear<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#fear<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Toute attitude no fear est sanctionnable.<\/p>\n          <p>Si tu constates un no fear en scène, demande à un staff de spectate et prépare un enregistrement.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.5<\/span><h3>Props block / body block<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#abus<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Si tu bloques accidentellement un ninja dans un mur, il est interdit d'en profiter pour l'attaquer.<\/p>\n          <p>Il est également interdit de bloquer, coincer ou exploiter volontairement le décor, les props ou les collisions du terrain pour :<\/p>\n          <ul><li>Attaquer un joueur.<\/li><li>Capturer un joueur.<\/li><li>Empêcher une action logique.<\/li><li>Obtenir un avantage artificiel.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.6<\/span><h3>Menottes<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#capture<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les menottes sont utilisables dans le village uniquement.<\/p>\n          <p>Ne menotte jamais quelqu'un :<\/p>\n          <ul><li>Qui ne se laisse pas faire.<\/li><li>Qui n'est pas en pain.<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.7<\/span><h3>Retour sur zone (NLR)<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#NLR<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le retour sur zone consiste à revenir sur une scène après l'avoir quittée ou après être tombé au combat.<\/p>\n          <p>Quand tu quittes une scène ou que tu tombes, tu ne peux pas revenir immédiatement pour la rejouer.<\/p>\n          <p>Tu dois aussi oublier les éléments directs de la scène précédente si ton retour n'est pas autorisé par le cadre en cours.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.8<\/span><h3>SafeRP<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#abus<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le safeRP consiste à abuser d'une zone, d'un groupe ou d'une protection de règle pour éviter une conséquence RP.<\/p>\n          <p>Exemples interdits :<\/p>\n          <ul>\n            <li>Cacher un objet sensible par un abus d'inventaire ou de zone protégée.<\/li>\n            <li>Rester dans une zone où les attaques sont interdites pour provoquer, attaquer ou sécuriser artificiellement un objet.<\/li>\n            <li>Utiliser une frontière ou une limite de règle comme bouclier.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 9.9<\/span><h3>RP à caractère sexuel<\/h3><span class=\"sev sev-critique\">Critique<\/span><\/div>\n        <div class=\"tags\"><span>#interdit<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les scènes et allusions à caractère sexuel sont formellement interdites.<\/p>\n          <p>Cette interdiction vaut :<\/p>\n          <ul><li>En jeu.<\/li><li>Dans les descriptions.<\/li><li>Dans les sous-entendus explicites liés à une scène RP.<\/li><\/ul>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-10\">\n      <h2>10. Subjutsu <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">Limites de slots subjutsu selon ton appartenance.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 10.1<\/span><h3>Slots de Subjutsu<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#subjutsu<\/span><span>#clan<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le nombre de subjutsu autorisés dépend de ton appartenance :<\/p>\n          <ul>\n            <li>Sans Clan : 3 subjutsu maximum.<\/li>\n            <li>Membre de clan : 2 subjutsu maximum.<\/li>\n            <li>Jinchuriki : aucun subjutsu.<\/li>\n          <\/ul>\n          <p>Précisions :<\/p>\n          <ul><li>Les Hidden de clan ne sont pas comptés dans les slots de subjutsu.<\/li><li>Interdit d'avoir 2 subjutsu de boost (voir 10.2).<\/li><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 10.2<\/span><h3>Rééquilibrage des Subjutsu<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#subjutsu<\/span><span>#boost<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Afin de préserver l'équilibre des affrontements et d'éviter les abus liés aux accumulations de bonus, le cumul de subjutsu de boost est encadré.<\/p>\n          <p>Il est désormais interdit de cumuler deux subjutsu de boost de compétence.<\/p>\n          <p>Autorisé :<\/p>\n          <ul><li>1 subjutsu de boost + 1 subjutsu offensif / d'attaque.<\/li><\/ul>\n          <p>Interdit :<\/p>\n          <ul><li>2 subjutsu de boost de compétence en même temps.<\/li><li>Tout cumul visant à empiler plusieurs augmentations de statistiques ou de capacités.<\/li><\/ul>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"rp-11\">\n      <h2>11. Mentalité RP <span class=\"badge\">RP<\/span><\/h2>\n      <p class=\"theme-intro\">L'état d'esprit à adopter face aux techniques et situations les plus extrêmes du serveur.<\/p>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 11.1<\/span><h3>Rang X<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#rangX<\/span><span>#repli<\/span><span>#RPK<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Le Rang X représente l'apogée de la maîtrise d'une nature de chakra : une technique secrète, rare et dévastatrice, capable à elle seule d'anéantir un champ de bataille entier.<\/p>\n          <p>Utiliser un Rang X n'est jamais un acte anodin. Cela doit rester exceptionnel, réservé aux moments où l'enjeu RP le justifie réellement, et jamais employé pour forcer une victoire facile ou écraser un adversaire sans réelle mise en scène.<\/p>\n\n          <p><strong>Avertissement :<\/strong><\/p>\n          <ul>\n            <li>Si un Rang X est utilisé sur un champ de bataille, un repli doit obligatoirement être effectué par le camp qui le subit.<\/li>\n            <li>Si ce repli n'est pas respecté, les hauts gradés à partir du rang de Tokubetsu Jonin (TKJ) présents sur le terrain sont automatiquement soumis au risque de RPK.<\/li>\n          <\/ul>\n\n          <p>Cette règle existe pour rappeler qu'un Rang X change immédiatement la nature d'un affrontement. Face à une telle puissance, refuser de reculer, continuer à se battre comme si de rien n'était ou ignorer la menace n'est pas seulement incohérent : c'est un manquement grave au fairplay et au fearRP attendu de tout Shinobi, quel que soit son grade.<\/p>\n          <p>Le repli doit être joué immédiatement et sincèrement dès l'apparition confirmée d'un Rang X. Les hauts gradés ont un devoir d'exemplarité : ce sont eux qui doivent montrer l'exemple en ordonnant ou en initiant le repli, plutôt que de chercher à prouver leur force face à une technique de ce niveau.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 11.2<\/span><h3>Maîtres Nature<\/h3><span class=\"sev sev-info\">Info<\/span><\/div>\n        <div class=\"tags\"><span>#maitreNature<\/span><span>#rangX<\/span><span>#académie<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Les Maîtres Nature sont considérés comme des Shinobi puissants sur le plateau : ils maîtrisent parfaitement leur nature propre et possèdent une puissance dépassant la quasi-totalité des autres Shinobi.<\/p>\n          <p>Ce statut leur permet, à terme, d'obtenir le Rang X après plusieurs entraînements extrêmes.<\/p>\n\n          <p><strong>Pré-requis :<\/strong><\/p>\n          <ul>\n            <li>Un Maître Nature ne peut pas posséder plus de 2 natures.<\/li>\n          <\/ul>\n\n          <p><strong>Rôle et fonctionnement :<\/strong><\/p>\n          <p>Les Maîtres Nature peuvent donner des cours à l'Académie (cours obligatoire) afin d'expliquer et de développer l'entraînement, avec suivi, des joueurs souhaitant approfondir leur maîtrise de cette nature et/ou débloquer une Hidden liée à celle-ci.<\/p>\n\n          <p><strong>Limite :<\/strong><\/p>\n          <ul>\n            <li>5 slots de Maître Nature maximum par village.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 11.3<\/span><h3>Académie<\/h3><span class=\"sev sev-moderee\">Modérée<\/span><\/div>\n        <div class=\"tags\"><span>#académie<\/span><span>#progression<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Sur ORAJIN, l'Académie a un fonctionnement différent des autres serveurs. Nous voulons apporter cette flamme du roleplay que beaucoup de serveurs perdent. C'est pour cela que l'Académie est obligatoire : des cours sont donnés, des entraînements sont mis en place pour pousser le suivi de progression de chaque joueur au maximum.<\/p>\n          <p>L'Académie n'est donc pas une simple formalité de passage, mais une étape RP à part entière, pensée pour donner de la profondeur et de la cohérence à l'apprentissage de chaque personnage, dès ses débuts.<\/p>\n\n          <p><strong>Avertissement :<\/strong><\/p>\n          <ul>\n            <li>Les personnes souhaitant monter en grade mais n'ayant pas suivi tous leurs cours obligatoires de la semaine se verront refuser leur montée en grade.<\/li>\n          <\/ul>\n\n          <p>De plus, l'Académie est obligatoire de Genin à Chunin, voire jusqu'à Chunin confirmé si le joueur souhaite approfondir ses connaissances sur un art spécifique.<\/p>\n          <p>Ce fonctionnement garantit que chaque progression reste méritée, documentée et cohérente avec l'investissement réel du joueur, plutôt que basée sur la seule ancienneté.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 11.4<\/span><h3>Invocations<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#invocation<\/span><span>#repli<\/span><span>#RPK<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Sur ORAJIN, les invocations partagent la même particularité que le Rang X : elles constituent une démonstration de puissance pure, capable à elle seule de renverser le rapport de force sur un champ de bataille.<\/p>\n          <p>Une invocation n'est jamais un simple effet visuel ou un renfort anodin. Faire apparaître une invocation en pleine bataille doit être joué avec tout le poids RP que cela implique, au même titre qu'un Rang X.<\/p>\n\n          <p><strong>Avertissement :<\/strong><\/p>\n          <ul>\n            <li>Toute invocation observée sur un champ de bataille entraîne obligatoirement un repli stratégique du camp qui y fait face.<\/li>\n            <li>Si ce repli n'est pas respecté, tout comme pour le Rang X, les ninjas hauts gradés (à partir du rang de Tokubetsu Jonin) présents sur le terrain seront soumis au risque de RPK.<\/li>\n          <\/ul>\n\n          <p>Cette règle vise à préserver la même cohérence que pour les Rang X : une invocation change immédiatement la nature d'un affrontement, et l'ignorer ou continuer à combattre comme si de rien n'était constitue un manquement grave au fearRP et au fairplay attendus de tout Shinobi, quel que soit son grade.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\">Art. 11.5<\/span><h3>Zones sous risque RPK<\/h3><span class=\"sev sev-severe\">Sévère<\/span><\/div>\n        <div class=\"tags\"><span>#RPK<\/span><span>#zone<\/span><\/div>\n        <div class=\"article-body\">\n          <p>Certaines zones du monde d'ORAJIN sont considérées comme sensibles en permanence : y pénétrer expose automatiquement au risque de RPK, sans nécessiter de déclaration ou de validation staff supplémentaire.<\/p>\n          <p><strong>Zones concernées :<\/strong><\/p>\n          <ul>\n            <li>Zone de clan.<\/li>\n            <li>Palais Kage.<\/li>\n            <li>Grotte Serpent.<\/li>\n            <li>Forêt Interdite.<\/li>\n          <\/ul>\n          <p>Entrer dans l'une de ces zones sans y être autorisé doit être joué avec la prudence et le fearRP que la situation impose : ce ne sont pas des lieux ordinaires, et leur intrusion peut avoir des conséquences RP immédiates et sévères.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"article\">\n        <div class=\"article-head\"><span class=\"art-num\
